<!doctype html><html lang="ko"><head><meta charset="utf-8"><title>서보·휠 메커니즘 30종 설계도</title>
<style>body{margin:0;font-family:Pretendard,sans-serif;background:#f1f5f9;color:#0f172a}
.bar{display:flex;flex-wrap:wrap;gap:5px;padding:10px 14px;background:#0f172a;position:sticky;top:0}
.bar button{border:0;border-radius:7px;padding:6px 10px;font-size:11.5px;font-weight:700;cursor:pointer;background:#1e293b;color:#cbd5e1}
.bar button.on{background:#3b82f6;color:#fff}.bar button.w.on{background:#eab308;color:#0f172a}
.sep{width:100%;height:1px;background:#334155;margin:3px 0}
.wrap{max-width:1240px;margin:14px auto;padding:0 14px}img{width:100%;border-radius:12px;box-shadow:0 8px 28px rgba(15,23,42,.1);background:#fff}</style></head>
<body><div class="bar"><button data-s="00" class="on">서보 15종 전체</button><button data-s="01" class="">M01 로커</button><button data-s="02" class="">M02 경첩</button><button data-s="03" class="">M03 평행</button><button data-s="04" class="">M04 쌍집게</button><button data-s="05" class="">M05 평행집게</button><button data-s="06" class="">M06 양날개</button><button data-s="07" class="">M07 슬라이더</button><button data-s="08" class="">M08 쌍피스톤</button><button data-s="09" class="">M09 토글</button><button data-s="10" class="">M10 직선</button><button data-s="11" class="">M11 시저스</button><button data-s="12" class="">M12 보행</button><button data-s="13" class="">M13 2축연동</button><button data-s="14" class="">M14 6절스쿱</button><button data-s="15" class="">M15 3D래칫</button><div class="sep"></div><button data-s="00w" class="w">휠 15종 전체</button><button data-s="w01" class="w">W01 와이퍼</button><button data-s="w02" class="w">W02 연속펌프</button><button data-s="w03" class="w">W03 오비탈</button><button data-s="w04" class="w">W04 박서2기통</button><button data-s="w05" class="w">W05 V트윈90°</button><button data-s="w06" class="w">W06 연속날개</button><button data-s="w07" class="w">W07 급속귀환</button><button data-s="w08" class="w">W08 드래그링크</button><button data-s="w09" class="w">W09 호이켄</button><button data-s="w10" class="w">W10 연속해머</button><button data-s="w11" class="w">W11 시저스펀치</button><button data-s="w12" class="w">W12 360°보행</button><button data-s="w13" class="w">W13 2족보행</button><button data-s="w14" class="w">W14 6절프레스</button><button data-s="w15" class="w">W15 간헐인덱서</button></div>
<div class="wrap"><img id="v" src="sheets/00.svg"/></div>
<script>document.querySelector('.bar').onclick=e=>{const b=e.target.closest('button');if(!b)return;
document.querySelectorAll('.bar button').forEach(x=>x.classList.toggle('on',x===b));
document.getElementById('v').src='sheets/'+b.dataset.s+'.svg';};</script></body></html>
