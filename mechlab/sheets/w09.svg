<text x="648" y="320" fill="#0f172a" font-size="13" font-weight="800">핵심 동작 요약</text>
<text x="648" y="344" fill="#475569" font-size="11.5">360° 회전 중 절반(180°)은 레이저처럼 </text>
<text x="648" y="363" fill="#475569" font-size="11.5">평탄한 직선 이송, 나머지 절반은 반원 복귀</text>
