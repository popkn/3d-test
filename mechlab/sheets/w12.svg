<rect x="630" y="82" width="314" height="462" rx="10" fill="#fff" stroke="#cbd5e1" stroke-width="1.2"/>
<text x="648" y="110" fill="#0f172a" font-size="14" font-weight="800">기구학 · 검증 명세</text>
<text x="648" y="136" fill="#334155" font-size="11.5">• 구동 방식: DC 130rpm 1개 + wheel-guide-30-nylon</text>
<text x="648" y="156" fill="#334155" font-size="11.5">• 핀 활용: Ø30 나일론 단일 핀 (R=10)</text>
<text x="648" y="176" fill="#334155" font-size="11.5">• 회전 관절: 후크 S35 × 5개</text>
<text x="648" y="196" fill="#334155" font-size="11.5">• 테스트 리그: 수직 3D 타워</text>
<text x="648" y="216" fill="#334155" font-size="11.5">• 회전 범위: 0° ~ 360°</text>
<text x="648" y="236" fill="#334155" font-size="11.5">• 출력 범위: 64.0 ~ 92.2</text>
<text x="648" y="256" fill="#15803d" font-size="12" font-weight="800">✔ 기구학 폐루프 오차: 0.0000 mm</text>
<text x="648" y="276" fill="#15803d" font-size="12" font-weight="800">✔ 실구멍 정합 &amp; 지면 접지: 0건 오류</text>
<line x1="648" y1="296" x2="926" y2="296" stroke="#e2e8f0"/>
<text x="648" y="320" fill="#0f172a" font-size="13" font-weight="800">핵심 동작 요약</text>
<text x="648" y="344" fill="#475569" font-size="11.5">엄격 그라쇼프 360° 회전 → 발끝이 완전한 </text>
<text x="648" y="363" fill="#475569" font-size="11.5">D자 폐곡선(접지 밀기→공중 복귀) 무한 보행</text>
