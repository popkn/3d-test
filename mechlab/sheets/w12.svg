<text x="648" y="430" fill="#0f172a" font-size="13" font-weight="800">벤치 구성 부품 (48개 + 가동 링크)</text>
<text x="648" y="452" fill="#475569" font-size="11">• bolt-m3x6 × 18</text>
<text x="648" y="469" fill="#475569" font-size="11">• dc-motor-130-rs × 1</text>
