<text x="648" y="176" fill="#334155" font-size="11.5">• 회전 관절: 후크 S35 × 2개</text>
<text x="648" y="196" fill="#334155" font-size="11.5">• 테스트 리그: 수평 XZ 벤치</text>
<text x="648" y="216" fill="#334155" font-size="11.5">• 서보 각도: 0° ~ 180°</text>
<text x="648" y="236" fill="#334155" font-size="11.5">• 출력 범위: 0.0 ~ 20.0</text>
<text x="648" y="256" fill="#15803d" font-size="12" font-weight="800">✔ 기구학 폐루프 오차: 0.0000 mm</text>
<text x="648" y="276" fill="#15803d" font-size="12" font-weight="800">✔ 실구멍 정합 &amp; 공중 부양: 0건</text>
