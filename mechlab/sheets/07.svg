<text x="648" y="110" fill="#0f172a" font-size="14" font-weight="800">기구학 · 검증 명세</text>
<text x="648" y="136" fill="#334155" font-size="11.5">• 구동 방식: 서보모터 1개 + Ø30 서보 가이드</text>
