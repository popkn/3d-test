<text x="648" y="320" fill="#0f172a" font-size="13" font-weight="800">핵심 동작 요약</text>
<text x="648" y="344" fill="#475569" font-size="11.5">무릎 관절이 180° 일직선을 +2.2 mm 넘</text>
<text x="648" y="363" fill="#475569" font-size="11.5">어 기계식 자가잠금 & 고배율 압착</text>
