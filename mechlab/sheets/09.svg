<rect x="630" y="82" width="314" height="462" rx="10" fill="#fff" stroke="#cbd5e1" stroke-width="1.2"/>
<text x="648" y="110" fill="#0f172a" font-size="14" font-weight="800">기구학 · 검증 명세</text>
<text x="648" y="136" fill="#334155" font-size="11.5">• 구동 방식: 서보모터 1개 + Ø30 서보 가이드</text>
<text x="648" y="156" fill="#334155" font-size="11.5">• 핀 활용: 단일 핀 (R=10)</text>
<text x="648" y="176" fill="#334155" font-size="11.5">• 회전 관절: 후크 S35 × 5개</text>
<text x="648" y="196" fill="#334155" font-size="11.5">• 테스트 리그: 수평 XZ 벤치</text>
<text x="648" y="216" fill="#334155" font-size="11.5">• 서보 각도: 0° ~ 145°</text>
<text x="648" y="236" fill="#334155" font-size="11.5">• 출력 범위: 26.5 ~ 30.0</text>
<text x="648" y="256" fill="#15803d" font-size="12" font-weight="800">✔ 기구학 폐루프 오차: 0.0000 mm</text>
<text x="648" y="276" fill="#15803d" font-size="12" font-weight="800">✔ 실구멍 정합 &amp; 공중 부양: 0건</text>
