<text x="648" y="110" fill="#0f172a" font-size="14" font-weight="800">기구학 · 검증 명세</text>
<text x="648" y="136" fill="#334155" font-size="11.5">• 구동 방식: DC 130rpm 1개 + wheel-guide-30-nylon</text>
<text x="648" y="156" fill="#334155" font-size="11.5">• 핀 활용: Ø30 나일론 1차 로드 원외 분기 (m=30)</text>
<text x="648" y="176" fill="#334155" font-size="11.5">• 회전 관절: 후크 S35 × 6개 (전원 2장)</text>
<text x="648" y="196" fill="#334155" font-size="11.5">• 테스트 리그: 수직 3D 타워</text>
<text x="648" y="216" fill="#334155" font-size="11.5">• 회전 범위: 0° ~ 360°</text>
<text x="648" y="236" fill="#334155" font-size="11.5">• 출력 범위: -77.3 ~ -48.8</text>
<text x="648" y="256" fill="#15803d" font-size="12" font-weight="800">✔ 기구학 폐루프 오차: 0.0000 mm</text>
