<text x="648" y="110" fill="#0f172a" font-size="14" font-weight="800">기구학 · 검증 명세</text>
<text x="648" y="136" fill="#334155" font-size="11.5">• 구동 방식: DC 130rpm 1개 + wheel-guide-40-yellow</text>
<text x="648" y="156" fill="#334155" font-size="11.5">• 핀 활용: Ø40 노랑 1차 링크 분기 (2장 밀착)</text>
<text x="648" y="176" fill="#334155" font-size="11.5">• 회전 관절: 후크 S35 × 6개</text>
<text x="648" y="196" fill="#334155" font-size="11.5">• 테스트 리그: 수직 3D 타워</text>
<text x="648" y="216" fill="#334155" font-size="11.5">• 회전 범위: 0° ~ 360°</text>
