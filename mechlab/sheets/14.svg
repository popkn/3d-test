<text x="648" y="320" fill="#0f172a" font-size="13" font-weight="800">핵심 동작 요약</text>
<text x="648" y="344" fill="#475569" font-size="11.5">1차 4절 붐 승강(-18°→+41°) + 2차</text>
<text x="648" y="363" fill="#475569" font-size="11.5"> 연동 링크가 그랩 버킷을 퍼올림→운반→자동 투</text>
