<text x="648" y="156" fill="#334155" font-size="11.5">• 핀 활용: 모터가이드 1차 링크 분기 (2장 밀착)</text>
<text x="648" y="176" fill="#334155" font-size="11.5">• 회전 관절: 후크 S35 × 6개</text>
