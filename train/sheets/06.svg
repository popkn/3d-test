<g transform="translate(407.8,392.0) rotate(-18.0) scale(0.78)"><rect x="-60" y="-26" width="120" height="52" rx="6" fill="#2b2c30"/><rect x="-60" y="-32" width="120" height="6" fill="#555"/><rect x="-60" y="26" width="120" height="6" fill="#555"/><circle cx="0" cy="0" r="10" fill="#2fae67"/><text x="0" y="-36" font-size="10" fill="#1d2230" text-anchor="middle" font-weight="700">마지막칸</text></g>
<line x1="333.6" y1="367.9" x2="363.1" y2="406.5" stroke="#f2c21b" stroke-width="4"/>
<text x="602.0" y="460.0" font-size="10.5" fill="#e8432a" font-weight="700" text-anchor="end">V자로 접힘 (잭나이프) ✘</text>
<rect x="650" y="300" width="560" height="170" fill="url(#g)" stroke="#aab4c3" stroke-dasharray="4 3"/>
<text x="658.0" y="318.0" font-size="11" fill="#1d2230" font-weight="700" text-anchor="start">셋 다 오른쪽 (보라 · 보라 · 보라)</text>
<g transform="translate(770.0,392.0) rotate(-12.0) scale(0.78)"><rect x="-60" y="-26" width="120" height="52" rx="6" fill="#2b2c30"/><rect x="-60" y="-32" width="120" height="6" fill="#555"/><rect x="-60" y="26" width="120" height="6" fill="#555"/><circle cx="0" cy="0" r="10" fill="#9b51e0"/><text x="0" y="-36" font-size="10" fill="#1d2230" text-anchor="middle" font-weight="700">앞칸</text></g>
<g transform="translate(892.3,366.0) rotate(-3.0) scale(0.78)"><rect x="-60" y="-26" width="120" height="52" rx="6" fill="#2b2c30"/><rect x="-60" y="-32" width="120" height="6" fill="#555"/><rect x="-60" y="26" width="120" height="6" fill="#555"/><circle cx="0" cy="0" r="10" fill="#9b51e0"/><text x="0" y="-36" font-size="10" fill="#1d2230" text-anchor="middle" font-weight="700">중간칸</text></g>
<line x1="816.0" y1="382.2" x2="845.3" y2="368.5" stroke="#f2c21b" stroke-width="4"/>
<g transform="translate(1017.1,359.5) rotate(6.0) scale(0.78)"><rect x="-60" y="-26" width="120" height="52" rx="6" fill="#2b2c30"/><rect x="-60" y="-32" width="120" height="6" fill="#555"/><rect x="-60" y="26" width="120" height="6" fill="#555"/><circle cx="0" cy="0" r="10" fill="#9b51e0"/><text x="0" y="-36" font-size="10" fill="#1d2230" text-anchor="middle" font-weight="700">마지막칸</text></g>
<line x1="939.2" y1="363.6" x2="970.4" y2="354.6" stroke="#f2c21b" stroke-width="4"/>
<text x="1202.0" y="460.0" font-size="10.5" fill="#2fae67" font-weight="700" text-anchor="end">부드럽게 회전 ✔</text>
<text x="50.0" y="506.0" font-size="12" fill="#1d2230" font-weight="700" text-anchor="start">② 조종 조합과 움직임</text>
<rect x="50" y="518" width="1160" height="26" fill="#eef2f7"/>
<text x="60.0" y="535.0" font-size="10.5" fill="#1d2230" font-weight="700" text-anchor="start">셋 다 전진</text>
<text x="270.0" y="535.0" font-size="10" fill="#1d2230" font-weight="400" text-anchor="start">세 칸이 같은 힘으로 밀고 당김 → 똑바로 달린다 (각 칸이 자기 무게만 끈다)</text>
<text x="1200.0" y="535.0" font-size="10.5" fill="#2fae67" font-weight="700" text-anchor="end">성공 ✔</text>
<text x="60.0" y="561.0" font-size="10.5" fill="#1d2230" font-weight="700" text-anchor="start">셋 다 같은 쪽 회전</text>
<text x="270.0" y="561.0" font-size="10" fill="#1d2230" font-weight="400" text-anchor="start">세 칸이 같은 원을 그리며 부드럽게 돈다</text>
<text x="1200.0" y="561.0" font-size="10.5" fill="#2fae67" font-weight="700" text-anchor="end">성공 ✔</text>
<rect x="50" y="570" width="1160" height="26" fill="#eef2f7"/>
<text x="60.0" y="587.0" font-size="10.5" fill="#1d2230" font-weight="700" text-anchor="start">앞칸 전진 · 뒤 두 칸 후진</text>
<text x="270.0" y="587.0" font-size="10" fill="#1d2230" font-weight="400" text-anchor="start">연결봉이 당겨져 앞칸만 끌려가다 미끄러짐, 앞뒤로 덜컹거리며 거의 제자리</text>
<text x="1200.0" y="587.0" font-size="10.5" fill="#e8432a" font-weight="700" text-anchor="end">엇갈림 ✘ (멈추지 않고 덜컹)</text>
<text x="60.0" y="613.0" font-size="10.5" fill="#1d2230" font-weight="700" text-anchor="start">앞칸 왼쪽 · 뒤칸 오른쪽</text>
<text x="270.0" y="613.0" font-size="10" fill="#1d2230" font-weight="400" text-anchor="start">열차가 S자로 꺾이며 옆으로 비틀거림</text>
<text x="1200.0" y="613.0" font-size="10.5" fill="#e8432a" font-weight="700" text-anchor="end">엇갈림 ✘ (비틀비틀)</text>
<rect x="50" y="622" width="1160" height="26" fill="#eef2f7"/>
<text x="60.0" y="639.0" font-size="10.5" fill="#1d2230" font-weight="700" text-anchor="start">중간칸만 정지</text>
<text x="270.0" y="639.0" font-size="10" fill="#1d2230" font-weight="400" text-anchor="start">중간칸 바퀴가 버팀 → 앞뒤 칸이 중간칸을 끌고 밀어 지그재그</text>
<text x="1200.0" y="639.0" font-size="10.5" fill="#e8432a" font-weight="700" text-anchor="end">엇갈림 ✘</text>
<text x="60.0" y="665.0" font-size="10.5" fill="#1d2230" font-weight="700" text-anchor="start">가운데만 후진</text>
<text x="270.0" y="665.0" font-size="10" fill="#1d2230" font-weight="400" text-anchor="start">앞 연결봉은 당기고 뒤 연결봉은 밀림 → 가운데가 옆으로 튀어나와 V자로 접힘</text>
<text x="1200.0" y="665.0" font-size="10.5" fill="#e8432a" font-weight="700" text-anchor="end">엇갈림 ✘ (접힘)</text>
<text x="50.0" y="698.0" font-size="12" fill="#1d2230" font-weight="700" text-anchor="start">③ 그림의 방향 색 (도면 설명용)</text>
<circle cx="60" cy="720" r="9" fill="#2fae67" stroke="#1d2230"/>
<text x="76.0" y="724.0" font-size="10.5" fill="#1d2230" font-weight="400" text-anchor="start">전진 = 초록</text>
<circle cx="210" cy="720" r="9" fill="#2f6fe0" stroke="#1d2230"/>
<text x="226.0" y="724.0" font-size="10.5" fill="#1d2230" font-weight="400" text-anchor="start">후진 = 파랑</text>
<circle cx="360" cy="720" r="9" fill="#f2c21b" stroke="#1d2230"/>
<text x="376.0" y="724.0" font-size="10.5" fill="#1d2230" font-weight="400" text-anchor="start">왼쪽 = 노랑</text>
<circle cx="510" cy="720" r="9" fill="#9b51e0" stroke="#1d2230"/>
<text x="526.0" y="724.0" font-size="10.5" fill="#1d2230" font-weight="400" text-anchor="start">오른쪽 = 보라</text>
<circle cx="660" cy="720" r="9" fill="#ffffff" stroke="#1d2230"/>
<text x="676.0" y="724.0" font-size="10.5" fill="#1d2230" font-weight="400" text-anchor="start">정지 = 흰색</text>
<text x="50.0" y="754.0" font-size="12" fill="#1d2230" font-weight="700" text-anchor="start">④ 협동 규칙</text>
<text x="60.0" y="772.0" font-size="10.5" fill="#3a4050" font-weight="400" text-anchor="start">• 각 칸은 자기 조종자의 명령만 따른다. 엇갈려도 스스로 멈추지 않고, 연결봉으로 서로 끌고 밀며 이상하게 움직인다.</text>
<text x="60.0" y="792.0" font-size="10.5" fill="#3a4050" font-weight="400" text-anchor="start">• 칸끼리 전선 · 통신이 없다. 같은 방향으로 가려면 세 사람이 말로 맞춰야 한다 ("하나 둘 셋, 전진!").</text>
<text x="60.0" y="812.0" font-size="10.5" fill="#3a4050" font-weight="400" text-anchor="start">• 세 칸은 바퀴 · 모터 · 전원이 같아 같은 명령이면 같은 속도로 달린다.</text></svg>