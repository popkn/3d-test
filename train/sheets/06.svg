<g transform="translate(891.3,173.8) rotate(4.0) scale(0.78)"><rect x="-60" y="-26" width="120" height="52" rx="6" fill="#2b2c30"/><rect x="-60" y="-32" width="120" height="6" fill="#555"/><rect x="-60" y="26" width="120" height="6" fill="#555"/><circle cx="0" cy="0" r="10" fill="#2fae67"/><text x="0" y="-36" font-size="10" fill="#1d2230" text-anchor="middle" font-weight="700">중간칸</text></g>
<line x1="815.6" y1="192.6" x2="844.4" y2="170.5" stroke="#f2c21b" stroke-width="4"/>
