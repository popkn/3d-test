<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1260 980" width="1260" height="980" font-family="JetBrains Mono, 'Noto Sans KR', sans-serif"><defs><pattern id="g" width="10" height="10" patternUnits="userSpaceOnUse"><path d="M10 0H0V10" fill="none" stroke="#e3e8ef" stroke-width="0.5"/></pattern></defs><rect width="100%" height="100%" fill="#f6f8fb"/><rect x="14" y="14" width="1232" height="952" fill="none" stroke="#1d2230" stroke-width="1.2"/>
