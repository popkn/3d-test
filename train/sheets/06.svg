<line x1="938.2" y1="177.0" x2="972.4" y2="200.1" stroke="#f2c21b" stroke-width="4"/>
<text x="1202.0" y="272.0" font-size="10.5" fill="#e8432a" font-weight="700" text-anchor="end">S자로 비틀거림 ✘</text>
<rect x="50" y="300" width="560" height="170" fill="url(#g)" stroke="#aab4c3" stroke-dasharray="4 3"/>
<text x="58.0" y="318.0" font-size="11" fill="#1d2230" font-weight="700" text-anchor="start">가운데만 후진 (초록 · 파랑 · 초록)</text>
<g transform="translate(170.0,392.0) rotate(-18.0) scale(0.78)"><rect x="-60" y="-26" width="120" height="52" rx="6" fill="#2b2c30"/><rect x="-60" y="-32" width="120" height="6" fill="#555"/><rect x="-60" y="26" width="120" height="6" fill="#555"/><circle cx="0" cy="0" r="10" fill="#2fae67"/><text x="0" y="-36" font-size="10" fill="#1d2230" text-anchor="middle" font-weight="700">앞칸</text></g>
<g transform="translate(288.9,353.4) rotate(18.0) scale(0.78)"><rect x="-60" y="-26" width="120" height="52" rx="6" fill="#2b2c30"/><rect x="-60" y="-32" width="120" height="6" fill="#555"/><rect x="-60" y="26" width="120" height="6" fill="#555"/><circle cx="0" cy="0" r="10" fill="#2f6fe0"/><text x="0" y="-36" font-size="10" fill="#1d2230" text-anchor="middle" font-weight="700">중간칸</text></g>
