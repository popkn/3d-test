<text x="303.3" y="44.0" font-size="17" fill="#ffffff" font-weight="700" text-anchor="start">협동 동작도 (같은 방향 · 다른 방향)</text>
<text x="1232.0" y="44.0" font-size="10.5" fill="#c8d3e6" font-weight="400" text-anchor="end">목표: 세 사람이 말로 맞춰 같은 방향으로</text>
<text x="50.0" y="104.0" font-size="12" fill="#1d2230" font-weight="700" text-anchor="start">① 위에서 본 열차 (왼쪽 = 앞, 동그라미 = 그 칸 조종자가 누른 방향)</text>
<rect x="50" y="112" width="560" height="170" fill="url(#g)" stroke="#aab4c3" stroke-dasharray="4 3"/>
