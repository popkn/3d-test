<text x="574.9" y="668.4" font-size="12" fill="#1d2230" font-weight="700" text-anchor="start">조립 순서</text>
<text x="574.9" y="685.4" font-size="9.5" fill="#3a4050" font-weight="400" text-anchor="start">• 바닥판 · 구동 모터 (칸마다): 모터프레임 3×3으로 DC 130rpm 모터 2개를 바닥판 뒤쪽 옆 끝에 눕힌다 (축이 바깥 · z</text>
<text x="586.9" y="698.4" font-size="9.5" fill="#3a4050" font-weight="400" text-anchor="start">+70). 휠 Ø50 + 타이어를 축에 (2.6 × 10).</text>
<text x="574.9" y="715.4" font-size="9.5" fill="#3a4050" font-weight="400" text-anchor="start">• 앞 바퀴 (칸마다): 축가이드 4개 (x ±25 · ±45, z −60)에 75 mm 축 2개, 바깥 끝에 휠 + 타이어 (헛돎).</text>
<text x="574.9" y="732.4" font-size="9.5" fill="#3a4050" font-weight="400" text-anchor="start">• 배터리 · 위층 · CPU · 블루투스 (칸마다): 배터리를 바닥판 가운데에. 서포트 30 위에 위층 판, 서포트 10 위에 CPU</text>
<text x="586.9" y="745.4" font-size="9.5" fill="#3a4050" font-weight="400" text-anchor="start">(6V), 앞쪽에 블루투스 모듈. 칸마다 다른 스마트폰과 짝 맺기.</text>
<text x="574.9" y="762.4" font-size="9.5" fill="#3a4050" font-weight="400" text-anchor="start">• 이 도면의 볼트 · 너트: 볼트 M3×10 × 84, 볼트 3×6 × 54, M3 너트 × 132, 볼트 2.6×10 와셔붙이 × 6</text></svg></section>

<text x="385.9" y="815.0" font-size="9.5" fill="#3a4050" font-weight="400" text-anchor="start">• 보일러: 중6 PCB 5장 (옆 4 · 위 1)을 L자 2×2로 상자로. 앞에 노란 휠가이드 Ø40 (보일러 문), 위에 서포트 굴뚝 (30 + 15 + 캡너트)과 증기 돔.</text>
<text x="385.9" y="832.0" font-size="9.5" fill="#3a4050" font-weight="400" text-anchor="start">• 운전실: 하프 PCB 두 장을 옆벽으로, ㅁ자 PCB를 앞창으로, 메인 PCB를 지붕으로 (L자는 위층 판 구멍 이용). 지붕 아래 뒤쪽에 부저 (기적).</text>

<text x="385.9" y="866.0" font-size="9.5" fill="#3a4050" font-weight="400" text-anchor="start">• 이 도면의 볼트 · 너트: 볼트 3×6 × 46, M3 너트 × 44</text></svg></section>

<text x="326.6" y="470.8" font-size="9.5" fill="#3a4050" font-weight="400" text-anchor="start">• 연결봉 (2곳): 소8 PCB의 2번 구멍을 앞 칸 바닥판 뒤 (z +65), 9번 구멍을 뒤 칸 바닥판 앞 (z −75)에 후크 S35로 눌러 끼운다. 칸 사이 42 mm, 연결봉은 좌우로 꺾인다.</text>
<text x="326.6" y="487.8" font-size="9.5" fill="#3a4050" font-weight="400" text-anchor="start">• 꺾임 센서 (2곳 × 좌우): 앞 칸 뒤쪽에 L자 2×2로 접촉 센서 2개를 버튼이 안쪽을 보게 세운다. 연결봉 앞 지렛대 (10 mm)가 25° 넘게 꺾이면 버튼을 누른다.</text>
<text x="326.6" y="504.8" font-size="9.5" fill="#3a4050" font-weight="400" text-anchor="start">• 이 도면의 볼트 · 너트: 볼트 3×6 × 16, M3 너트 × 16</text></svg></section>

<text x="1202.0" y="460.0" font-size="10.5" fill="#2fae67" font-weight="700" text-anchor="end">부드럽게 회전 ✔</text>
<text x="50.0" y="506.0" font-size="12" fill="#1d2230" font-weight="700" text-anchor="start">② 조종 조합과 움직임</text>
<rect x="50" y="518" width="1160" height="26" fill="#eef2f7"/>
<text x="60.0" y="535.0" font-size="10.5" fill="#1d2230" font-weight="700" text-anchor="start">셋 다 전진</text>
<text x="270.0" y="535.0" font-size="10" fill="#1d2230" font-weight="400" text-anchor="start">세 칸이 같은 힘으로 밀고 당김 → 똑바로 빠르게 달린다 (각 칸이 자기 무게만 끈다)</text>
<text x="1200.0" y="535.0" font-size="10.5" fill="#2fae67" font-weight="700" text-anchor="end">성공 ✔</text>
<text x="60.0" y="561.0" font-size="10.5" fill="#1d2230" font-weight="700" text-anchor="start">셋 다 같은 쪽 회전</text>
<text x="270.0" y="561.0" font-size="10" fill="#1d2230" font-weight="400" text-anchor="start">세 칸이 같은 원을 그리며 부드럽게 돈다</text>
<text x="1200.0" y="561.0" font-size="10.5" fill="#2fae67" font-weight="700" text-anchor="end">성공 ✔</text>
<rect x="50" y="570" width="1160" height="26" fill="#eef2f7"/>
<text x="60.0" y="587.0" font-size="10.5" fill="#1d2230" font-weight="700" text-anchor="start">앞칸 전진 · 뒤 두 칸 후진</text>
<text x="270.0" y="587.0" font-size="10" fill="#1d2230" font-weight="400" text-anchor="start">연결봉이 당겨져 앞칸만 끌려가다 미끄러짐, 앞뒤로 덜컹거리며 거의 제자리</text>
<text x="1200.0" y="587.0" font-size="10.5" fill="#e8432a" font-weight="700" text-anchor="end">엇갈림 ✘ (멈추지 않고 덜컹)</text>
<text x="60.0" y="613.0" font-size="10.5" fill="#1d2230" font-weight="700" text-anchor="start">앞칸 왼쪽 · 뒤칸 오른쪽</text>
<text x="270.0" y="613.0" font-size="10" fill="#1d2230" font-weight="400" text-anchor="start">열차가 S자로 꺾이며 옆으로 비틀거림, 연결봉이 꺾여 꺾임 센서 경고</text>
<text x="1200.0" y="613.0" font-size="10.5" fill="#e8432a" font-weight="700" text-anchor="end">엇갈림 ✘ (비틀비틀)</text>
<rect x="50" y="622" width="1160" height="26" fill="#eef2f7"/>
<text x="60.0" y="639.0" font-size="10.5" fill="#1d2230" font-weight="700" text-anchor="start">중간칸만 정지</text>
<text x="270.0" y="639.0" font-size="10" fill="#1d2230" font-weight="400" text-anchor="start">중간칸 바퀴가 버팀 → 앞뒤 칸이 중간칸을 끌고 밀어 지그재그</text>
<text x="1200.0" y="639.0" font-size="10.5" fill="#e8432a" font-weight="700" text-anchor="end">엇갈림 ✘</text>
<text x="60.0" y="665.0" font-size="10.5" fill="#1d2230" font-weight="700" text-anchor="start">가운데만 후진</text>
<text x="270.0" y="665.0" font-size="10" fill="#1d2230" font-weight="400" text-anchor="start">앞 연결봉은 당기고 뒤 연결봉은 밀림 → 가운데가 옆으로 튀어나와 V자로 접힘 (잭나이프)</text>
<text x="1200.0" y="665.0" font-size="10.5" fill="#e8432a" font-weight="700" text-anchor="end">엇갈림 ✘ (접힘)</text>
<text x="50.0" y="698.0" font-size="12" fill="#1d2230" font-weight="700" text-anchor="start">③ 방향 램프 색 (각 칸 RGB LED = 그 칸 조종자의 명령)</text>
<circle cx="60" cy="720" r="9" fill="#2fae67" stroke="#1d2230"/>
<text x="76.0" y="724.0" font-size="10.5" fill="#1d2230" font-weight="400" text-anchor="start">전진 = 초록</text>
<circle cx="210" cy="720" r="9" fill="#2f6fe0" stroke="#1d2230"/>
<text x="226.0" y="724.0" font-size="10.5" fill="#1d2230" font-weight="400" text-anchor="start">후진 = 파랑</text>
<circle cx="360" cy="720" r="9" fill="#f2c21b" stroke="#1d2230"/>
<text x="376.0" y="724.0" font-size="10.5" fill="#1d2230" font-weight="400" text-anchor="start">왼쪽 = 노랑</text>
<circle cx="510" cy="720" r="9" fill="#9b51e0" stroke="#1d2230"/>
<text x="526.0" y="724.0" font-size="10.5" fill="#1d2230" font-weight="400" text-anchor="start">오른쪽 = 보라</text>
<circle cx="660" cy="720" r="9" fill="#ffffff" stroke="#1d2230"/>
<text x="676.0" y="724.0" font-size="10.5" fill="#1d2230" font-weight="400" text-anchor="start">정지 = 흰색</text>
<text x="50.0" y="754.0" font-size="12" fill="#1d2230" font-weight="700" text-anchor="start">④ 협동 규칙</text>
<text x="60.0" y="772.0" font-size="10.5" fill="#3a4050" font-weight="400" text-anchor="start">• 로봇은 엇갈려도 스스로 멈추지 않는다 — 각 칸은 자기 조종자의 명령만 따른다 (의도한 대로 이상하게 움직임).</text>
<text x="60.0" y="792.0" font-size="10.5" fill="#3a4050" font-weight="400" text-anchor="start">• 대신 알려 준다: 각 칸 RGB 램프가 그 칸 조종 방향 색을 보여 주고, 연결봉이 25° 넘게 꺾이면 그 칸 부저가 울린다.</text>
<text x="60.0" y="812.0" font-size="10.5" fill="#3a4050" font-weight="400" text-anchor="start">• 셋이 같은 방향을 3초 유지하면 기관차 기적이 "뿌-" 하고 울려 성공을 알린다 (기관차는 꺾임 센서가 조용한지로 판단).</text>
<text x="60.0" y="832.0" font-size="10.5" fill="#3a4050" font-weight="400" text-anchor="start">• 속도는 리모컨으로 3단계. 처음에는 1단계로 연습한다. 칸끼리 통신하지 않으므로 사람끼리 "하나 둘 셋 출발!"처럼 말로 맞춘다.</text></svg></section>
