<text x="86.0" y="646.0" font-size="9.2" fill="#1d2230" font-weight="700" text-anchor="middle">IN1</text>
<text x="160.0" y="646.0" font-size="10.2" fill="#1d2230" font-weight="700" text-anchor="start">적외선 센서 (전방)</text>
<text x="480.0" y="646.0" font-size="9.8" fill="#1d2230" font-weight="400" text-anchor="start">집게 사이 상대 포착 → 자동 포획·어퍼컷·해머 콤보 트리거</text>
