<text x="160.0" y="669.0" font-size="10.2" fill="#1d2230" font-weight="700" text-anchor="start">컬러 센서 (후방 바닥)</text>
<text x="480.0" y="669.0" font-size="9.8" fill="#1d2230" font-weight="400" text-anchor="start">경기장 경계선 감지 → 자동 후진·회피 (링아웃 방지)</text>
