<text x="60.0" y="311.0" font-size="10.5" fill="#2fae67" font-weight="700" text-anchor="start">✔ 꼬리 해머 서보 토크 여유</text>
<text x="390.0" y="311.0" font-size="10.0" fill="#1d2230" font-weight="400" text-anchor="start">필요 0.44 kg·cm / 서보 4.0 kg·cm (안전율 9.2×)</text>
<text x="50.0" y="342.0" font-size="12.5" fill="#1d2230" font-weight="700" text-anchor="start">② 전기 배선 (4WD M1~M4 + 확장 보드 EX-M1/M2 + OUT1~5 + IN1~3)</text>
