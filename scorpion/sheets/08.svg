<text x="160.0" y="577.0" font-size="10.2" fill="#1d2230" font-weight="700" text-anchor="start">Servo Motor (전갈 꼬리)</text>
<text x="480.0" y="577.0" font-size="9.8" fill="#1d2230" font-weight="400" text-anchor="start">오버헤드 전갈 꼬리 해머 (대기 55° → 타격 0° 다운스트라이크)</text>
