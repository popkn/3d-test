<text x="480.0" y="738.0" font-size="9.8" fill="#1d2230" font-weight="400" text-anchor="start">하부 중앙 저중심 6V 전원 → CPU + 확장 보드 A3</text>
<text x="50.0" y="770.0" font-size="12.5" fill="#1d2230" font-weight="700" text-anchor="start">③ 전투 운용 &amp; 안전 페일세이프</text>
<text x="60.0" y="788.0" font-size="9.8" fill="#1d2230" font-weight="400" text-anchor="start">• 4WD 주행 (M1~M4): 130rpm × 4 · Ø50 바퀴 직결 · 최고 0.54 m/s · 제자리 초신속 선회</text>
<text x="60.0" y="805.0" font-size="9.8" fill="#1d2230" font-weight="400" text-anchor="start">• 무기 1 (EX-M1/M2): 쌍발 400rpm 수직 어퍼컷 초승달 낫 (Ø104 mm · 날 끝 2.18 m/s · 자이로 상쇄)</text>
<text x="60.0" y="822.0" font-size="9.8" fill="#1d2230" font-weight="400" text-anchor="start">• 무기 2 (OUT1/OUT2): 대칭 4절링크 양집게 크러셔 (160 mm 개방 ↔ 37.7 mm 압착 · 토크 2.87× 증폭)</text>
<text x="60.0" y="839.0" font-size="9.8" fill="#1d2230" font-weight="400" text-anchor="start">• 무기 3 (OUT3): 오버헤드 전갈 꼬리 해머 (55° 대기 → 0° 내려찍기 · 수직 낫 상단 +11.4 mm 여유)</text>
<text x="60.0" y="856.0" font-size="9.8" fill="#1d2230" font-weight="400" text-anchor="start">• 안전 페일세이프: 블루투스 신호 0.5초 이상 끊김 시 구동 4축 + 수직 낫 2축 즉시 정지, 집게 개방, 꼬리 대기 복귀.</text></svg>