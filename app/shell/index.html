<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#f8f7f4" />
  <title>로보로보 완성 로봇 조립</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&family=Noto+Sans+KR:wght@400;600;700&display=swap" />
  <style>
/* 로보로보 완성 로봇 조립 뷰어 · 모바일 D안 (몰입형 HUD) */
:root {
  --noise: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='140' height='140'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='3' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .5  0 0 0 0 .48  0 0 0 0 .45  0 0 0 .09 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
  --bg: #efede9; --panel: #f8f7f4; --ink: #1d1d1f; --soft: #63615c; --line: #e2dfd9; --white: #fff;
  --accent: #e8432a; --accent-t: #c2341c; --ok: #1f8a50;
  --glass: rgba(248, 247, 244, 0.88);
  --ease: cubic-bezier(.3, .9, .3, 1); --spring: cubic-bezier(.3, 1.45, .4, 1);
  --sat: env(safe-area-inset-top, 0px); --sab: env(safe-area-inset-bottom, 0px);
  --sal: env(safe-area-inset-left, 0px); --sar: env(safe-area-inset-right, 0px);
  font-family: "JetBrains Mono", "Noto Sans KR", ui-monospace, monospace;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; overflow: hidden; overscroll-behavior: none; }
body { word-break: keep-all; overflow-wrap: anywhere; background: var(--panel); color: var(--ink); font-size: 13px; letter-spacing: 0.01em; -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; }
button { font: inherit; color: inherit; cursor: pointer; }
[hidden] { display: none !important; }
.bar { display: inline-block; width: 3px; height: 13px; background: var(--accent); margin-right: 8px; vertical-align: -1px; }
#app { position: fixed; inset: 0; overflow: hidden; }
.screen { position: absolute; inset: 0; overflow: hidden; }

/* 누름 피드백 */
.pr { transition: transform .14s var(--ease), background-color .22s, color .22s, border-color .22s, box-shadow .22s, opacity .22s; }
.pr:active { transform: scale(.93); }
.pr:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.ibtn { width: 44px; height: 44px; flex: none; display: flex; align-items: center; justify-content: center; border: 1px solid var(--line); border-radius: 14px; background: rgba(255, 255, 255, .75); }
.ibtn[aria-pressed="true"] { background: var(--ink); border-color: var(--ink); color: #fff; }
.glass { background: var(--glass); -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px); box-shadow: 0 4px 18px rgba(0, 0, 0, .08); }
@keyframes rise { from { transform: translateY(14px); opacity: 0 } to { transform: none; opacity: 1 } }
@keyframes fade { from { opacity: 0 } to { opacity: 1 } }
@keyframes sheet { from { transform: translateY(100%) } to { transform: none } }
@keyframes dlg { from { transform: scale(.92); opacity: 0 } to { transform: none; opacity: 1 } }
@keyframes ring { 0% { transform: scale(1); opacity: .55 } 100% { transform: scale(1.55); opacity: 0 } }
@keyframes pop { from { transform: scale(.4) rotate(-20deg); opacity: 0 } to { transform: none; opacity: 1 } }

/* ───────── 첫 화면 ───────── */
#home { display: flex; flex-direction: column; gap: 14px; padding: calc(var(--sat) + 18px) calc(var(--sar) + 16px) calc(var(--sab) + 16px) calc(var(--sal) + 16px);
  background: var(--panel); }
.h-head { display: grid; grid-template-columns: minmax(0, 1fr) auto; grid-template-areas: "title acts" "bar bar"; align-items: center; gap: 12px; animation: fade .4s ease both; }
.h-title { grid-area: title; min-width: 0; padding: 0 2px; }
.h-acts { grid-area: acts; display: flex; gap: 8px; }
.fbar { grid-area: bar; }
.eyebrow { font-size: 11px; color: var(--soft); letter-spacing: .08em; }
.h-title h1 { font-size: 24px; letter-spacing: -0.01em; margin-top: 4px; display: flex; align-items: baseline; gap: 8px; }
.h-title h1 small { font-size: 12px; font-weight: 700; color: var(--accent-t); }
.ibtn.solidbtn { background: var(--ink); border-color: var(--ink); color: #fff; }
.fbar { position: relative; display: flex; gap: 2px; padding: 4px; border-radius: 16px; background: rgba(0, 0, 0, .05); overflow: hidden; min-width: 0; }
.fbar .fpill { position: absolute; top: 4px; bottom: 4px; left: 0; width: 0; border-radius: 12px; background: #fff; box-shadow: 0 1px 3px rgba(0, 0, 0, .12), 0 4px 10px rgba(0, 0, 0, .04); transition: transform .38s var(--ease), width .38s var(--ease); }
.ftab { position: relative; z-index: 1; flex: none; max-width: 150px; min-width: 0; height: 40px; padding: 0 14px; border: 0; background: transparent; border-radius: 12px; display: flex; align-items: center; gap: 7px;
  font-size: 13px; font-weight: 700; color: var(--soft); white-space: nowrap; transition: color .25s; }
.ftab[aria-selected="true"] { color: var(--ink); }
.ftab .fname { overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.ftab .fdot { width: 8px; height: 8px; border-radius: 3px; flex: none; }
.ftab .fcnt { font-size: 11px; font-weight: 700; color: var(--soft); background: rgba(0, 0, 0, .06); border-radius: 6px; padding: 1px 6px; flex: none; }
.ftab[aria-selected="true"] .fcnt { background: rgba(232, 67, 42, .1); color: var(--accent-t); }
.ftab.more { flex: none; color: var(--ink); }
.cards { flex: 1; min-height: 0; display: flex; flex-direction: column; gap: 12px; }
.card { flex: 0 0 calc((100% - 24px) / 3); min-height: 0; display: flex; gap: 14px; padding: 10px; border-radius: 24px; background: #fff;
  border: 1px solid rgba(0, 0, 0, .06); box-shadow: 0 1px 2px rgba(0, 0, 0, .04), 0 10px 24px -12px rgba(0, 0, 0, .12);
  animation: rise .44s cubic-bezier(.2, .8, .2, 1) both; transition: transform .2s var(--ease), box-shadow .2s; }
.card.leaving { animation: leave .26s ease both; }
@keyframes leave { to { transform: scale(.96); opacity: 0 } }
.thumb { -webkit-touch-callout: none; touch-action: none; position: relative; width: 46%; flex: none; border: 0; padding: 0; border-radius: 18px; overflow: hidden; cursor: pointer;
  background: radial-gradient(75% 70% at 50% 42%, #fbfaf8 0%, #ecebe7 70%, #e4e2dd 100%); transition: transform .18s var(--ease); }
.thumb.tdrag { cursor: grabbing; }
.thumb::after { content: ""; position: absolute; inset: 0; border-radius: inherit; box-shadow: inset 0 0 0 1px rgba(0, 0, 0, .04); pointer-events: none; }
.thumb .idx { position: absolute; z-index: 3; top: 10px; left: 12px; font-size: 10px; font-weight: 700; color: var(--soft); letter-spacing: .06em; }
.thumb .live { position: absolute; z-index: 3; right: 10px; bottom: 10px; display: flex; align-items: center; gap: 5px; padding: 3px 7px; border-radius: 8px; background: rgba(255, 255, 255, .8);
  font-size: 9px; font-weight: 700; color: var(--soft); letter-spacing: .06em; opacity: 0; transform: translateY(4px); transition: opacity .4s .2s, transform .4s .2s var(--ease); }
.thumb .live i { width: 6px; height: 6px; border-radius: 50%; background: var(--ok); }
.thumb.ready .live { opacity: 1; transform: none; }
.tload { position: absolute; z-index: 3; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; transition: opacity .35s; }
.thumb.ready .tload { opacity: 0; pointer-events: none; }
.tload svg { width: 44px; height: 44px; transform: rotate(-90deg); }
.tload .trk { stroke: rgba(0, 0, 0, .08); }
.tload .arc { stroke: var(--accent); stroke-linecap: round; transition: stroke-dashoffset .25s; }
.tload span { font-size: 10px; font-weight: 700; color: var(--soft); }
.tload.wait .arc { stroke: #cfccc6; }
.info { flex: 1; min-width: 0; display: flex; flex-direction: column; justify-content: space-between; gap: 6px; padding: 4px 2px 2px; }
.names { display: flex; flex-direction: column; gap: 1px; min-width: 0; }
.chipf { align-self: flex-start; display: inline-flex; align-items: center; gap: 5px; max-width: 100%; height: 20px; padding: 0 8px; margin-bottom: 6px; border-radius: 7px; background: rgba(0, 0, 0, .05);
  font-size: 10px; font-weight: 700; color: var(--soft); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.chipf i { width: 7px; height: 7px; border-radius: 2px; flex: none; }
.lbl { font-size: 10px; color: var(--soft); letter-spacing: .04em; }
.rname { font-size: 16px; line-height: 1.28; letter-spacing: -0.01em; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
.rname + .lbl { margin-top: 7px; }
.maker { font-size: 13px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.maker.none { font-weight: 400; color: #8a8782; }
.meta { display: flex; gap: 6px; flex-wrap: wrap; }
.meta span { font-size: 10px; font-weight: 700; color: var(--soft); padding: 3px 7px; border-radius: 6px; background: var(--panel); border: 1px solid var(--line); }
.itop { display: flex; gap: 8px; min-width: 0; }
.itop .names { flex: 1; }
.mini { display: flex; flex-direction: column; gap: 6px; flex: none; }
.mini .ibtn { width: 38px; height: 38px; border-radius: 12px; background: #fff; }
.acts { display: flex; gap: 6px; }
.primary { flex: none; width: 100%; min-width: 0; white-space: nowrap; height: 46px; display: flex; align-items: center; justify-content: center; gap: 8px; border: 0; border-radius: 14px; background: var(--ink); color: #fff; font-size: 13px; font-weight: 700;
  box-shadow: 0 6px 14px -6px rgba(29, 29, 31, .5); }
.empty { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; text-align: center; animation: rise .4s cubic-bezier(.2, .8, .2, 1) both; }
.empty .eic { width: 84px; height: 84px; border-radius: 26px; display: flex; align-items: center; justify-content: center; background: #fff; border: 1px dashed #cfccc6; }
.empty b { font-size: 16px; }
.empty p { font-size: 12px; color: var(--soft); line-height: 1.6; }
.empty .primary { width: auto; padding: 0 22px; margin-top: 6px; }
.tcan { position: absolute; inset: 0; width: 100%; height: 100%; display: block; z-index: 1; pointer-events: none; }

/* 시트 (아래에서 올라옴 · 가로는 가운데 창) */
.modal { position: absolute; inset: 0; z-index: 40; }
.scrim { position: absolute; inset: 0; border: 0; background: rgba(29, 29, 31, .4); animation: fade .24s ease both; }
.sheet { position: absolute; left: 0; right: 0; bottom: 0; max-height: 86%; padding: 10px 20px calc(var(--sab) + 22px); border-radius: 28px 28px 0 0; background: var(--panel);
  display: flex; flex-direction: column; gap: 14px; box-shadow: 0 -12px 40px rgba(0, 0, 0, .18); animation: sheet .38s cubic-bezier(.2, .9, .25, 1) both; }
.modal.out .scrim { animation: fade .22s ease reverse both; }
.modal.out .sheet { animation: sheetOut .24s cubic-bezier(.4, 0, 1, 1) both; }
@keyframes sheetOut { to { transform: translateY(100%) } }
.grab { align-self: center; width: 40px; height: 5px; border-radius: 3px; background: #c9c6c0; flex: none; }
.sheet h2 { font-size: 17px; display: flex; align-items: center; }
.sheet .hint { font-size: 12px; color: var(--soft); margin-top: -8px; }
.field { display: flex; flex-direction: column; gap: 6px; font-size: 12px; font-weight: 700; }
.field input { font: inherit; font-size: 16px; font-weight: 600; height: 52px; padding: 0 14px; border: 1.5px solid #d6d3cd; border-radius: 14px; background: #fff; color: var(--ink); outline: none;
  -webkit-user-select: text; user-select: text; transition: border-color .2s, box-shadow .2s; }
.field input:focus { border-color: var(--accent); box-shadow: 0 0 0 4px rgba(232, 67, 42, .14); }
.field .cnt { align-self: flex-end; font-size: 10px; font-weight: 400; color: var(--soft); margin-top: -2px; }
.swatches { display: flex; gap: 10px; }
.sw { width: 40px; height: 40px; border-radius: 13px; border: 0; display: flex; align-items: center; justify-content: center; box-shadow: inset 0 0 0 1px rgba(0, 0, 0, .08); }
.sw svg { opacity: 0; transform: scale(.4); transition: all .22s var(--spring); }
.sw[aria-checked="true"] { box-shadow: 0 0 0 3px var(--panel), 0 0 0 5px currentColor; }
.sw[aria-checked="true"] svg { opacity: 1; transform: none; }
.opts { display: flex; flex-direction: column; gap: 6px; }
.opt { min-height: 54px; display: flex; align-items: center; gap: 12px; padding: 0 14px; border-radius: 16px; border: 1.5px solid transparent; background: #fff; font-size: 14px; font-weight: 700; text-align: left; }
.opt .odot { width: 28px; height: 28px; flex: none; border-radius: 9px; display: flex; align-items: center; justify-content: center; background: rgba(0, 0, 0, .05); }
.opt .oname { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.opt small { font-size: 11px; font-weight: 400; color: var(--soft); }
.opt .ock { width: 22px; height: 22px; flex: none; border-radius: 50%; border: 1.5px solid #cfccc6; display: flex; align-items: center; justify-content: center; transition: all .2s var(--ease); }
.opt .ock svg { opacity: 0; transform: scale(.4); transition: all .22s var(--spring); }
.opt[aria-checked="true"] { border-color: var(--ink); }
.opt[aria-checked="true"] .ock { background: var(--accent); border-color: var(--accent); }
.opt[aria-checked="true"] .ock svg { opacity: 1; transform: none; }
.opt.add { border: 1.5px dashed #cfccc6; background: transparent; color: var(--accent-t); }
.two { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.two button, .one { height: 52px; border-radius: 16px; font-size: 14px; font-weight: 700; }
.ghost { border: 1px solid #d6d3cd; background: #fff; }
.solid { border: 0; background: var(--accent); color: #fff; box-shadow: 0 8px 18px -8px rgba(232, 67, 42, .7); }
.solid:disabled { background: #d6d3cd; box-shadow: none; color: #fff; }
.danger { border: 0; background: transparent; color: #b3261e; height: 44px; font-size: 13px; font-weight: 700; }
.htoast { position: absolute; z-index: 45; left: 50%; bottom: calc(var(--sab) + 24px); transform: translate(-50%, 12px); padding: 10px 16px; border-radius: 14px; background: rgba(29, 29, 31, .92);
  color: #fff; font-size: 12px; font-weight: 700; white-space: nowrap; opacity: 0; pointer-events: none; transition: opacity .25s, transform .32s var(--ease); }
.htoast.show { opacity: 1; transform: translate(-50%, 0); }

/* ───────── 조립 뷰어 ───────── */
.stage { position: absolute; inset: 0; background: var(--bg); }
.stage canvas { display: block; touch-action: none; }
.hud { position: absolute; z-index: 5; }
/* 매트 유리: 블러 + 미세한 노이즈 + 안쪽 하이라이트 */
.matte { isolation: isolate; contain: paint;
  background: linear-gradient(180deg, rgba(255, 255, 255, .62) 0%, rgba(246, 244, 240, .52) 100%);
  -webkit-backdrop-filter: blur(16px) saturate(1.3); backdrop-filter: blur(16px) saturate(1.3);
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, .85), inset 0 0 0 1px rgba(255, 255, 255, .35), 0 0 0 1px rgba(0, 0, 0, .06), 0 2px 4px rgba(0, 0, 0, .04), 0 18px 40px -16px rgba(40, 32, 24, .28); }
.matte::before { content: ""; position: absolute; inset: 0; z-index: -1; border-radius: inherit; pointer-events: none; opacity: .5; mix-blend-mode: multiply;
  background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='140' height='140'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='3' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .5  0 0 0 0 .48  0 0 0 0 .45  0 0 0 .09 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>"); }

/* 왼쪽 위: 뒤로 아이콘 ─ 제목 (한 줄, 박스 없음) */
.ttlbar { position: absolute; z-index: 5; top: calc(var(--sat) + 14px); left: calc(var(--sal) + 6px); right: calc(var(--sar) + 150px); display: flex; align-items: center; min-width: 0; }
.backi { width: 44px; height: 44px; flex: none; display: flex; align-items: center; justify-content: center; border: 0; background: transparent; border-radius: 50%; color: var(--ink); transition: transform .14s var(--ease), background-color .2s; }
.backi:active { transform: scale(.88); background: rgba(0, 0, 0, .06); }
.rule { width: 22px; height: 1.5px; flex: none; margin: 0 12px 0 2px; border-radius: 1px; background: linear-gradient(90deg, rgba(29, 29, 31, .7), rgba(29, 29, 31, .25)); }
.ttl { flex: 1; min-width: 0; text-shadow: 0 0 10px var(--bg), 0 0 2px var(--bg); }
.ttl b, .ttl span { display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ttl b { font-size: 16px; letter-spacing: -0.01em; line-height: 1.25; }
.ttl span { font-size: 11px; color: var(--soft); margin-top: 1px; }

/* 오른쪽 위: 모듈 선택 + 설정 캡슐 */
.trc { position: absolute; z-index: 7; top: calc(var(--sat) + 12px); right: calc(var(--sar) + 12px); display: flex; align-items: center; padding: 4px; border-radius: 18px; }
.trc > button { height: 40px; border: 0; background: transparent; border-radius: 14px; display: flex; align-items: center; justify-content: center; gap: 6px; color: var(--ink); font-size: 12px; font-weight: 700;
  transition: background-color .22s, color .22s, transform .14s var(--ease); }
.trc > button:active { transform: scale(.93); }
.trc > button[aria-expanded="true"] { background: var(--ink); color: #fff; }
#modBtn { padding: 0 10px 0 11px; }
#modBtn .mcnt { font-variant-numeric: tabular-nums; }
#modBtn .chev { transition: transform .32s var(--ease); }
#modBtn[aria-expanded="true"] .chev { transform: rotate(180deg); }
#tune { width: 40px; }
.trc .vsep { width: 1px; height: 20px; margin: 0 3px; background: rgba(0, 0, 0, .1); }
.drop { position: absolute; z-index: 6; top: calc(var(--sat) + 64px); right: calc(var(--sar) + 12px); width: 272px; max-width: calc(100% - 24px); padding: 8px; border-radius: 20px;
  transform-origin: top right; animation: drop .3s cubic-bezier(.2, .9, .3, 1.15) both; }
.drop.closing { animation: dropOut .18s ease both; }
@keyframes drop { from { opacity: 0; transform: translateY(-8px) scaleY(.6); clip-path: inset(0 0 100% 0 round 20px) } to { opacity: 1; transform: none; clip-path: inset(0 0 0 0 round 20px) } }
@keyframes dropOut { to { opacity: 0; transform: translateY(-6px) scaleY(.85) } }
.dhead { display: flex; align-items: center; justify-content: space-between; padding: 6px 8px 8px; font-size: 11px; font-weight: 700; color: var(--soft); letter-spacing: .04em; }
.dhead button { height: 26px; padding: 0 9px; border: 0; border-radius: 8px; background: rgba(232, 67, 42, .1); color: var(--accent-t); font-size: 11px; font-weight: 700; }
.mlist { display: flex; flex-direction: column; gap: 4px; }
.mod { min-height: 46px; display: flex; align-items: center; gap: 10px; padding: 0 10px 0 8px; border: 0; border-radius: 13px; background: rgba(255, 255, 255, .7); text-align: left; font-size: 12px; font-weight: 700;
  box-shadow: 0 0 0 1px rgba(0, 0, 0, .05); animation: rise .3s cubic-bezier(.2, .8, .2, 1) both; transition: background-color .2s, opacity .2s, transform .14s var(--ease); }
.mod:active { transform: scale(.97); }
.mod .mno { width: 34px; height: 26px; flex: none; display: flex; align-items: center; justify-content: center; border-radius: 8px; background: var(--ink); color: #fff; font-size: 11px; transition: background-color .25s; }
.mod.pending .mno { background: #d9d6d0; color: var(--soft); }
.mod .mnm { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.mod .eye { width: 30px; height: 18px; flex: none; border-radius: 9px; position: relative; background: var(--accent); transition: background-color .22s; }
.mod .eye::after { content: ""; position: absolute; top: 2px; left: 14px; width: 14px; height: 14px; border-radius: 50%; background: #fff; box-shadow: 0 1px 2px rgba(0, 0, 0, .25); transition: left .24s var(--spring); }
.mod[aria-pressed="false"] { background: rgba(255, 255, 255, .35); color: var(--soft); }
.mod[aria-pressed="false"] .mnm { text-decoration: line-through; }
.mod[aria-pressed="false"] .eye { background: #cfccc6; }
.mod[aria-pressed="false"] .eye::after { left: 2px; }
.prow { display: flex; align-items: center; gap: 10px; padding: 4px 6px 10px; }
.prow > span { font-size: 11px; font-weight: 700; color: var(--soft); width: 54px; flex: none; }
.pseg { position: relative; flex: 1; display: flex; padding: 3px; height: 40px; border-radius: 12px; background: rgba(0, 0, 0, .06); box-shadow: inset 0 1px 2px rgba(0, 0, 0, .08); }
.pseg .pill { position: absolute; top: 3px; bottom: 3px; left: 3px; width: calc((100% - 6px) / 4); border-radius: 9px; background: #fff; box-shadow: 0 1px 3px rgba(0, 0, 0, .16); transition: transform .32s var(--ease); }
.pseg button { position: relative; z-index: 1; flex: 1; border: 0; background: transparent; font-size: 12px; font-weight: 700; color: var(--soft); transition: color .2s; font-variant-numeric: tabular-nums; }
.pseg button[aria-pressed="true"] { color: var(--ink); }
.chips { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; padding: 0 2px 2px; }
.chip { height: 44px; display: flex; align-items: center; gap: 8px; padding: 0 10px; font-size: 12px; font-weight: 700; border-radius: 12px; border: 0; background: rgba(255, 255, 255, .7); box-shadow: 0 0 0 1px rgba(0, 0, 0, .05); }
.chip .box { width: 20px; height: 20px; flex: none; display: flex; align-items: center; justify-content: center; border-radius: 6px; border: 1.5px solid #bdbab4; transition: all .22s var(--ease); }
.chip .box svg { opacity: 0; transform: scale(.5); transition: all .22s var(--spring); }
.chip[aria-pressed="true"] { background: var(--ink); color: #fff; box-shadow: none; }
.chip[aria-pressed="true"] .box { background: var(--accent); border-color: var(--accent); }
.chip[aria-pressed="true"] .box svg { opacity: 1; transform: none; }

/* 지금 단계 칩 */
.now { position: absolute; z-index: 4; top: calc(var(--sat) + 66px); left: calc(var(--sal) + 14px); max-width: calc(100% - 28px); display: flex; align-items: center; gap: 8px; padding: 7px 12px 7px 10px; border-radius: 12px; font-size: 12px; font-weight: 700; pointer-events: none; }
.now i { width: 8px; height: 8px; flex: none; border-radius: 50%; background: var(--accent); box-shadow: 0 0 0 3px rgba(232, 67, 42, .18); transition: background .3s, box-shadow .3s; }
.now.done i { background: var(--ok); box-shadow: 0 0 0 3px rgba(31, 138, 80, .18); }
.now span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.now.flash { animation: rise .32s cubic-bezier(.2, .8, .2, 1); }

/* ───── 아래 컨트롤러 (매트 유리) ───── */
.player { left: calc(var(--sal) + 10px); right: calc(var(--sar) + 10px); bottom: calc(var(--sab) + 12px); padding: 14px 16px 10px; border-radius: 30px; display: flex; flex-direction: column; gap: 8px; }
.pages { position: relative; transition: height .52s cubic-bezier(.3, .9, .25, 1); }
.page { display: grid; gap: 10px; transition: opacity .3s ease, transform .5s cubic-bezier(.3, .9, .25, 1), filter .3s ease; }
.page.off { position: absolute; left: 0; right: 0; top: 0; opacity: 0; transform: translateY(16px) scale(.985); filter: blur(5px); pointer-events: none; }
.page.on > * { animation: rise .46s cubic-bezier(.2, .8, .2, 1) both; }
.page.on > .r2 { animation-delay: .04s; } .page.on > .r3 { animation-delay: .08s; } .page.on > .r4 { animation-delay: .12s; }
.page.still > * { animation: none; }
.asm { grid-template-areas: "read" "scrub" "tp" "ex"; }
.readout { grid-area: read; display: flex; align-items: flex-end; gap: 14px; min-width: 0; padding: 0 4px; }
.counter { flex: none; display: flex; flex-direction: column; gap: 2px; }
.counter small, .ftitle small { font-size: 9px; font-weight: 700; letter-spacing: .14em; color: var(--soft); }
.counter b { font-size: 24px; line-height: 1; letter-spacing: -0.02em; font-variant-numeric: tabular-nums; }
.counter b em { font-style: normal; font-size: 14px; color: var(--soft); font-weight: 600; }
#stepName { flex: 1; min-width: 0; padding-bottom: 2px; font-size: 11px; line-height: 1.4; color: var(--soft); text-align: right; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
.scrub { grid-area: scrub; min-width: 0; padding: 0 2px; }
/* 막대그래프 스크러버 (캔버스) */
.tb { position: relative; height: 50px; touch-action: none; cursor: ew-resize; border-radius: 8px; outline: none; }
.tb.sm { height: 40px; }
.tb canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.tb:focus-visible { box-shadow: 0 0 0 2px rgba(232, 67, 42, .55); }
.tb[aria-disabled="true"] { cursor: default; }
.tp { grid-area: tp; display: flex; align-items: center; justify-content: center; gap: 12px; }
.rb { width: 48px; height: 48px; flex: none; display: flex; align-items: center; justify-content: center; border: 0; border-radius: 50%; color: var(--ink);
  background: linear-gradient(180deg, #ffffff 0%, #f1efeb 100%);
  box-shadow: 0 0 0 1px rgba(0, 0, 0, .07), 0 1px 2px rgba(0, 0, 0, .08), 0 6px 12px -6px rgba(0, 0, 0, .25), inset 0 1px 0 #fff, inset 0 -2px 3px rgba(0, 0, 0, .04);
  transition: transform .14s var(--ease), box-shadow .14s; }
.rb:active { transform: translateY(1px) scale(.95); box-shadow: 0 0 0 1px rgba(0, 0, 0, .08), inset 0 2px 4px rgba(0, 0, 0, .12); }
.rb.sm { width: 40px; height: 40px; background: transparent; box-shadow: none; color: var(--soft); }
.rb.sm:active { background: rgba(0, 0, 0, .06); box-shadow: none; }
.playwrap { position: relative; width: 66px; height: 66px; flex: none; margin: 0 4px; }
.playwrap::before { content: ""; position: absolute; inset: -5px; border-radius: 50%; background: rgba(0, 0, 0, .05); box-shadow: inset 0 1px 3px rgba(0, 0, 0, .12), 0 1px 0 rgba(255, 255, 255, .8); }
.playwrap::after { content: ""; position: absolute; inset: 0; border-radius: 50%; border: 2px solid var(--accent); opacity: 0; pointer-events: none; }
.playing .playwrap::after { animation: ring 1.6s cubic-bezier(.2, .7, .3, 1) infinite; }
.play { position: relative; width: 100%; height: 100%; border: 0; border-radius: 50%; color: #fff; display: flex; align-items: center; justify-content: center;
  background: radial-gradient(circle at 50% 22%, #ff8a73 0%, #ef4f35 45%, #d4361d 100%);
  box-shadow: 0 1px 0 rgba(255, 255, 255, .45) inset, 0 -3px 6px rgba(120, 20, 5, .25) inset, 0 8px 18px -6px rgba(214, 54, 29, .7), 0 0 0 1px rgba(150, 30, 10, .25);
  transition: transform .14s var(--ease), box-shadow .14s; }
.play:active { transform: scale(.94); box-shadow: 0 2px 6px rgba(120, 20, 5, .35) inset, 0 3px 8px -4px rgba(214, 54, 29, .6); }
.play svg { filter: drop-shadow(0 1px 1px rgba(120, 20, 5, .35)); animation: pop .26s var(--spring) both; }
.play .i-pause, .playing .play .i-play { display: none; }
.playing .play .i-pause { display: block; }
.play .i-play { margin-left: 3px; }
.exrow2 { grid-area: ex; display: flex; flex-direction: column; gap: 0; padding-top: 6px; border-top: 1px solid rgba(0, 0, 0, .06); box-shadow: inset 0 1px 0 rgba(255, 255, 255, .6); }
.fhead { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 0 4px; height: 20px; }
.flab { display: flex; align-items: center; gap: 6px; font-size: 11px; font-weight: 700; color: var(--ink); letter-spacing: .02em; }
.flab svg { color: var(--soft); }
.fhead output { font-size: 11px; font-weight: 700; color: var(--accent-t); font-variant-numeric: tabular-nums; }

/* 기능 조작 페이지 */
.fn { grid-template-columns: minmax(0, 1fr); }
.fhd { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; padding: 0 4px; }
.ftitle { display: flex; flex-direction: column; gap: 2px; flex: none; }
.ftitle b { font-size: 17px; letter-spacing: -0.01em; }
.stats { display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; min-width: 0; }
.stats span { display: inline-flex; align-items: baseline; gap: 5px; height: 24px; padding: 0 8px; border-radius: 8px; background: rgba(0, 0, 0, .045); box-shadow: inset 0 1px 1px rgba(0, 0, 0, .06);
  font-size: 10px; color: var(--soft); white-space: nowrap; align-items: center; }
.stats span b { font-size: 11px; color: var(--ink); font-variant-numeric: tabular-nums; }
.stats span.ok b { color: var(--ok); } .stats span.bad b { color: var(--accent-t); }
.fgrid { display: grid; gap: 8px; grid-template-columns: minmax(0, 1fr); }
.frow { display: flex; flex-direction: column; gap: 2px; min-width: 0; animation: rise .42s cubic-bezier(.2, .8, .2, 1) both; }
.frow:not(.inline) .seg { flex: none; }
.frow.inline { flex-direction: row; align-items: center; gap: 10px; }
.frow.inline .flab { width: 64px; flex: none; }
.seg { position: relative; flex: 1; display: flex; padding: 3px; height: 42px; border-radius: 13px; background: rgba(0, 0, 0, .055); box-shadow: inset 0 1px 2px rgba(0, 0, 0, .1), 0 1px 0 rgba(255, 255, 255, .7); min-width: 0; }
.seg .pill { position: absolute; top: 3px; bottom: 3px; left: 3px; border-radius: 10px; background: linear-gradient(180deg, #fff, #f6f4f0);
  box-shadow: 0 1px 3px rgba(0, 0, 0, .16), inset 0 1px 0 #fff; transition: transform .34s var(--ease), background-color .3s; }
.seg.go .pill { background: linear-gradient(180deg, #2a2a2d, #1d1d1f); }
.seg button { position: relative; z-index: 1; flex: 1; min-width: 0; border: 0; background: transparent; font-size: 12px; font-weight: 700; color: var(--soft); transition: color .22s; white-space: nowrap; }
.seg button[aria-pressed="true"] { color: var(--ink); }
.seg.go button[aria-pressed="true"] { color: #fff; }
.facts { display: grid; grid-template-columns: repeat(auto-fit, minmax(0, 1fr)); grid-auto-flow: column; gap: 6px; }
.act, .ftog { height: 44px; min-width: 0; display: flex; align-items: center; justify-content: center; gap: 7px; padding: 0 10px; border: 0; border-radius: 13px; font-size: 12px; font-weight: 700; color: var(--ink); white-space: nowrap;
  background: linear-gradient(180deg, #ffffff 0%, #f2f0ec 100%); box-shadow: 0 0 0 1px rgba(0, 0, 0, .07), 0 1px 2px rgba(0, 0, 0, .07), inset 0 1px 0 #fff; transition: transform .14s var(--ease), box-shadow .2s, background .25s, color .25s; }
.act:active, .ftog:active { transform: translateY(1px) scale(.97); box-shadow: 0 0 0 1px rgba(0, 0, 0, .08), inset 0 2px 4px rgba(0, 0, 0, .1); }
.act.hot { color: #fff; background: radial-gradient(circle at 50% 0%, #ff8a73 0%, #ef4f35 55%, #d4361d 100%); box-shadow: 0 6px 14px -6px rgba(214, 54, 29, .7), inset 0 1px 0 rgba(255, 255, 255, .4); }
.ftog .lamp { width: 8px; height: 8px; border-radius: 50%; background: #cfccc6; box-shadow: inset 0 1px 1px rgba(0, 0, 0, .2); transition: background .25s, box-shadow .25s; }
.ftog[aria-pressed="true"] { background: linear-gradient(180deg, #2a2a2d, #1d1d1f); color: #fff; box-shadow: 0 0 0 1px #1d1d1f, inset 0 1px 0 rgba(255, 255, 255, .12); }
.ftog[aria-pressed="true"] .lamp { background: #5ee08f; box-shadow: 0 0 0 3px rgba(94, 224, 143, .2), 0 0 8px rgba(94, 224, 143, .8); }

/* 모드 전환 버튼 */
.modesw { position: relative; height: 46px; display: flex; align-items: center; gap: 10px; padding: 0 12px 0 8px; border: 0; border-radius: 16px; text-align: left; color: var(--ink);
  background: rgba(255, 255, 255, .55); box-shadow: inset 0 0 0 1px rgba(0, 0, 0, .06), inset 0 1px 0 rgba(255, 255, 255, .9); transition: transform .14s var(--ease), background-color .25s; overflow: hidden; }
.modesw:active { transform: scale(.98); background: rgba(255, 255, 255, .8); }
.msic { width: 30px; height: 30px; flex: none; display: flex; align-items: center; justify-content: center; border-radius: 10px; color: #fff;
  background: radial-gradient(circle at 50% 0%, #ff8a73 0%, #ef4f35 55%, #d4361d 100%); box-shadow: 0 4px 10px -4px rgba(214, 54, 29, .7), inset 0 1px 0 rgba(255, 255, 255, .4); transition: background .3s; }
[data-mode="fn"] .msic { background: linear-gradient(180deg, #3a3a3d, #1d1d1f); box-shadow: inset 0 1px 0 rgba(255, 255, 255, .15); }
.mslab { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.mslab b { font-size: 13px; }
.mslab small { font-size: 10px; color: var(--soft); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.mslab.swap { animation: rise .35s cubic-bezier(.2, .8, .2, 1) both; }
.mschev { color: var(--soft); transition: transform .4s var(--ease); }
[data-mode="fn"] .mschev { transform: rotate(180deg); }
.trc #modBtn, .trc .vsep { transition: opacity .3s, width .3s; }
.fnmode .trc #modBtn, .fnmode .trc .vsep { display: none; }
.toast { position: absolute; z-index: 30; left: 50%; bottom: calc(var(--sab) + 360px); transform: translate(-50%, 10px); padding: 9px 14px; border-radius: 12px; background: rgba(29, 29, 31, .88); color: #fff; font-size: 12px; font-weight: 700; white-space: nowrap; opacity: 0; pointer-events: none; transition: opacity .25s, transform .3s var(--ease); }
.toast.show { opacity: 1; transform: translate(-50%, 0); }
.tip { position: absolute; z-index: 6; left: 0; top: 0; padding: 7px 10px; border-radius: 10px; background: #fff; box-shadow: 0 4px 14px rgba(0, 0, 0, .14); font-size: 12px; font-weight: 700; pointer-events: none; opacity: 0; transition: opacity .2s; max-width: 240px; }
.tip small { display: block; font-size: 10px; font-weight: 400; color: var(--soft); }
.tip.show { opacity: 1; }
.loading { position: absolute; z-index: 25; left: 50%; top: 50%; width: 260px; margin: -48px 0 0 -130px; padding: 16px; border-radius: 20px; display: flex; flex-direction: column; gap: 10px; font-size: 12px; animation: dlg .26s ease both; }
.lbar { height: 8px; border-radius: 4px; background: rgba(0, 0, 0, .07); box-shadow: inset 0 1px 2px rgba(0, 0, 0, .14); overflow: hidden; }
.lbar i { display: block; height: 100%; width: 0; background: linear-gradient(180deg, #f36a52, #d93a21); transition: width .2s; }
.loading span { color: var(--soft); font-size: 11px; }

/* ───────── 가로 (960 × 412) ───────── */
@media (orientation: landscape) {
  #home { padding: calc(var(--sat) + 12px) calc(var(--sar) + 18px) calc(var(--sab) + 14px) calc(var(--sal) + 18px); gap: 12px; }
  .h-head { grid-template-columns: auto minmax(0, 1fr) auto; grid-template-areas: "title bar acts"; gap: 14px; }
  .h-title h1 { font-size: 18px; margin-top: 2px; }
  .cards { flex-direction: row; }
  .card { flex: 0 0 calc((100% - 24px) / 3); flex-direction: column; gap: 8px; padding: 8px; }
  .thumb { width: auto; height: 46%; }
  .info { padding: 0 4px; }
  .rname { -webkit-line-clamp: 1; }
  .chipf { margin-bottom: 4px; }
  .mini { flex-direction: row; }
  .names .lbl { display: none; }
  .rname + .lbl + .maker { margin-top: 2px; }
  .maker::before { content: "제작 · "; font-weight: 400; color: var(--soft); }
  .sheet { left: 50%; right: auto; top: 50%; bottom: auto; width: 460px; max-height: 92%; transform: translate(-50%, -50%); border-radius: 26px; padding: 18px 22px 20px; animation: dlgc .28s cubic-bezier(.2, .9, .3, 1.15) both; }
  .modal.out .sheet { animation: dlgcOut .2s ease both; }
  @keyframes dlgc { from { transform: translate(-50%, -50%) scale(.92); opacity: 0 } to { transform: translate(-50%, -50%); opacity: 1 } }
  @keyframes dlgcOut { to { transform: translate(-50%, -50%) scale(.95); opacity: 0 } }
  .sheet .grab { display: none; }
  .opts.grid2 { display: grid; grid-template-columns: 1fr 1fr; }
  .ttlbar { right: auto; max-width: 420px; }
  .now { top: calc(var(--sat) + 62px); }
  .drop { width: 360px; }
  .drop .mlist { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 4px; }
  .mod { min-width: 0; }
  .player { left: calc(var(--sal) + 10px); right: calc(var(--sar) + 10px); bottom: calc(var(--sab) + 10px); padding: 10px 14px 8px; border-radius: 26px; gap: 6px; }
  .asm { grid-template-areas: "read scrub tp ex"; grid-template-columns: 140px minmax(0, 1fr) auto 190px; align-items: center; gap: 16px; }
  .readout { flex-direction: column; align-items: flex-start; gap: 4px; padding: 0; }
  #stepName { text-align: left; -webkit-line-clamp: 1; width: 100%; }
  .counter b { font-size: 20px; }
  .tp { gap: 8px; }
  .rb { width: 42px; height: 42px; }
  .rb.sm { width: 34px; height: 34px; }
  .playwrap { width: 54px; height: 54px; margin: 0 3px; }
  .exrow2 { border-top: 0; box-shadow: none; padding-top: 0; }
  .fn { grid-template-columns: 150px minmax(0, 1fr); align-items: start; gap: 16px; }
  .fhd { flex-direction: column; align-items: flex-start; gap: 8px; padding: 2px 0 0; }
  .stats { justify-content: flex-start; }
  .fgrid { grid-template-columns: repeat(2, minmax(0, 1fr)); column-gap: 18px; row-gap: 6px; }
  .fgrid .wide { grid-column: 1 / -1; }
  .fgrid { grid-auto-flow: row dense; }
  .fgrid [data-col="ca"] { grid-column: 1; }
  .fgrid [data-col="cb"] { grid-column: 2; }
  .modesw { height: 38px; border-radius: 13px; }
  .msic { width: 26px; height: 26px; border-radius: 8px; }
  .mslab { flex-direction: row; align-items: baseline; gap: 10px; }
  .toast { bottom: calc(var(--sab) + 150px); }
}

/* ───────── 매트 유리 공통 (카드 · 버튼 · 시트 — 컨트롤러와 같은 재질) ───────── */
/* 뒤를 흐리는 떠 있는 유리 */
.card, .fbar, .h-acts .ibtn, .sheet, .htoast, .empty .eic {
  background-color: transparent;
  background-image: var(--noise), linear-gradient(180deg, rgba(255, 255, 255, .64) 0%, rgba(246, 244, 240, .5) 100%);
  -webkit-backdrop-filter: blur(16px) saturate(1.3); backdrop-filter: blur(16px) saturate(1.3);
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, .85), inset 0 0 0 1px rgba(255, 255, 255, .35), 0 0 0 1px rgba(0, 0, 0, .06), 0 2px 4px rgba(0, 0, 0, .04), 0 18px 40px -16px rgba(40, 32, 24, .28);
  border: 0;
}
.sheet { background-image: var(--noise), linear-gradient(180deg, rgba(252, 251, 249, .9) 0%, rgba(244, 242, 238, .86) 100%); }
.htoast { background-image: var(--noise), linear-gradient(180deg, rgba(48, 48, 52, .86), rgba(29, 29, 31, .86)); color: #fff; box-shadow: inset 0 1px 0 rgba(255, 255, 255, .14), 0 0 0 1px rgba(0, 0, 0, .2), 0 12px 30px -10px rgba(0, 0, 0, .45); }
/* 유리 위에 놓이는 버튼 (같은 결 · 블러 없이 가볍게) */
.mini .ibtn, .opt, .ghost, .act, .ftog, .rb:not(.sm), .chip, .mod, .modesw, .field input {
  background-image: var(--noise), linear-gradient(180deg, rgba(255, 255, 255, .78) 0%, rgba(244, 242, 238, .62) 100%);
  background-color: transparent;
  border: 0;
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, .95), inset 0 -1px 0 rgba(0, 0, 0, .03), 0 0 0 1px rgba(0, 0, 0, .07), 0 1px 2px rgba(0, 0, 0, .06), 0 6px 14px -8px rgba(40, 32, 24, .3);
}
.rb:not(.sm):active, .act:active, .ftog:active, .opt:active, .ghost:active, .mini .ibtn:active, .chip:active, .mod:active {
  box-shadow: inset 0 2px 4px rgba(0, 0, 0, .1), inset 0 0 0 1px rgba(0, 0, 0, .08);
}
.field input { box-shadow: inset 0 1px 2px rgba(0, 0, 0, .08), inset 0 0 0 1.5px rgba(0, 0, 0, .1), 0 1px 0 rgba(255, 255, 255, .8); }
.field input:focus { box-shadow: inset 0 1px 2px rgba(0, 0, 0, .06), inset 0 0 0 1.5px var(--accent), 0 0 0 4px rgba(232, 67, 42, .14); }
.opt[aria-checked="true"] { box-shadow: inset 0 1px 0 rgba(255, 255, 255, .95), 0 0 0 1.5px var(--ink), 0 6px 14px -8px rgba(40, 32, 24, .3); }
.opt.add { background-image: none; box-shadow: inset 0 0 0 1.5px rgba(0, 0, 0, .14); border: 0; }
.mod[aria-pressed="false"] { background-image: var(--noise), linear-gradient(180deg, rgba(255, 255, 255, .32), rgba(244, 242, 238, .24)); }
.fbar .fpill { background-image: var(--noise), linear-gradient(180deg, rgba(255, 255, 255, .95), rgba(247, 245, 241, .88)); box-shadow: inset 0 1px 0 #fff, 0 0 0 1px rgba(0, 0, 0, .06), 0 2px 6px rgba(0, 0, 0, .08); }
.fbar { background-image: var(--noise), linear-gradient(180deg, rgba(0, 0, 0, .05), rgba(0, 0, 0, .03)); -webkit-backdrop-filter: blur(16px); backdrop-filter: blur(16px);
  box-shadow: inset 0 1px 2px rgba(0, 0, 0, .08), 0 1px 0 rgba(255, 255, 255, .8); }
/* 진한 유리 (주요 버튼 · 켜진 상태) */
.primary, .ibtn.solidbtn, .chip[aria-pressed="true"], .ftog[aria-pressed="true"], .trc > button[aria-expanded="true"] {
  background-image: var(--noise), linear-gradient(180deg, rgba(58, 58, 62, .94) 0%, rgba(29, 29, 31, .94) 100%);
  background-color: transparent; color: #fff; border: 0;
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, .16), inset 0 -1px 0 rgba(0, 0, 0, .3), 0 0 0 1px rgba(0, 0, 0, .35), 0 8px 18px -8px rgba(0, 0, 0, .5);
}
.ibtn.solidbtn { -webkit-backdrop-filter: none; backdrop-filter: none; }
/* 빨간 유리 (저장 · 만들기 · 공격) */
.solid, .act.hot {
  background-image: var(--noise), radial-gradient(120% 140% at 50% 0%, #ff8a73 0%, #ef4f35 52%, #d4361d 100%);
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, .4), inset 0 -2px 4px rgba(120, 20, 5, .2), 0 0 0 1px rgba(150, 30, 10, .25), 0 8px 18px -8px rgba(214, 54, 29, .7);
}
.solid:disabled { background-image: var(--noise), linear-gradient(180deg, #dcd9d3, #cfccc6); box-shadow: inset 0 1px 0 rgba(255, 255, 255, .5); }
.play { background-image: var(--noise), radial-gradient(circle at 50% 22%, #ff8a73 0%, #ef4f35 45%, #d4361d 100%); }
/* 카드 안 3D 자리: 유리 안쪽으로 살짝 파인 무광 판 */
.thumb { background: var(--noise), radial-gradient(75% 70% at 50% 42%, rgba(255, 255, 255, .75) 0%, rgba(236, 235, 231, .7) 70%, rgba(226, 224, 219, .75) 100%);
  box-shadow: inset 0 1px 3px rgba(0, 0, 0, .1), inset 0 0 0 1px rgba(0, 0, 0, .05), 0 1px 0 rgba(255, 255, 255, .8); }
.thumb::after { box-shadow: none; }
.thumb .live { background-image: var(--noise), linear-gradient(180deg, rgba(255, 255, 255, .85), rgba(244, 242, 238, .75)); box-shadow: inset 0 1px 0 #fff, 0 0 0 1px rgba(0, 0, 0, .06); }
.meta span, .chipf { background-image: var(--noise), linear-gradient(180deg, rgba(255, 255, 255, .6), rgba(244, 242, 238, .5)); border: 0; box-shadow: inset 0 1px 0 rgba(255, 255, 255, .9), 0 0 0 1px rgba(0, 0, 0, .06); }
/* 첫 화면 배경: 유리가 보이도록 은은한 빛 */
#home { background: var(--panel); }
.modal .scrim { background: rgba(29, 29, 31, .34); }

/* ───────── 카드 편집 패널 (연필 버튼에서 펼쳐지는 매트 유리) ───────── */
.card { position: relative; }
.card > .thumb, .card > .info { transition: opacity .3s ease, filter .3s ease, transform .4s var(--ease); }
.card.editing > .thumb, .card.editing > .info { opacity: .28; filter: blur(3px) saturate(.8); transform: scale(.985); pointer-events: none; }
.card.editing { z-index: 10; }
.cedit { position: absolute; z-index: 12; left: 6px; right: 6px; top: 6px; padding: 12px 14px 14px; border-radius: 20px; display: flex; flex-direction: column; gap: 9px;
  background-image: var(--noise), linear-gradient(180deg, rgba(255, 255, 255, .78) 0%, rgba(246, 244, 240, .7) 100%);
  -webkit-backdrop-filter: blur(18px) saturate(1.3); backdrop-filter: blur(18px) saturate(1.3);
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, .9), inset 0 0 0 1px rgba(255, 255, 255, .4), 0 0 0 1px rgba(0, 0, 0, .07), 0 4px 10px rgba(0, 0, 0, .06), 0 24px 50px -18px rgba(40, 32, 24, .4);
  animation: ceIn .42s cubic-bezier(.2, .9, .25, 1) both; }
.cedit.out { animation: ceOut .24s cubic-bezier(.4, 0, 1, 1) both; pointer-events: none; }
@keyframes ceIn { from { clip-path: circle(0px at var(--ox) var(--oy)); opacity: .4; transform: scale(.96) } to { clip-path: circle(160% at var(--ox) var(--oy)); opacity: 1; transform: none } }
@keyframes ceOut { from { clip-path: circle(160% at var(--ox) var(--oy)); opacity: 1 } to { clip-path: circle(0px at var(--ox) var(--oy)); opacity: .3 } }
.cedit > * { animation: rise .4s cubic-bezier(.2, .8, .2, 1) both; }
.cedit > :nth-child(2) { animation-delay: .05s; } .cedit > :nth-child(3) { animation-delay: .09s; } .cedit > :nth-child(4) { animation-delay: .13s; } .cedit > :nth-child(5) { animation-delay: .17s; }
.ce-h { display: flex; align-items: center; justify-content: space-between; height: 28px; }
.ce-h b { font-size: 14px; display: flex; align-items: center; }
.ce-x { width: 32px; height: 32px; border: 0; border-radius: 10px; display: flex; align-items: center; justify-content: center; color: var(--soft); background: transparent; transition: background-color .2s, transform .14s var(--ease); }
.ce-x:active { transform: scale(.9); background: rgba(0, 0, 0, .06); }
.cfield { display: flex; flex-direction: column; gap: 4px; font-size: 11px; font-weight: 700; color: var(--soft); }
.cfield .row2 { display: flex; justify-content: space-between; align-items: baseline; }
.cfield .row2 i { font-style: normal; font-weight: 400; font-size: 10px; }
.cfield input { font: inherit; font-size: 15px; font-weight: 700; color: var(--ink); height: 42px; padding: 0 12px; border: 0; border-radius: 12px; outline: none; -webkit-user-select: text; user-select: text;
  background-image: var(--noise), linear-gradient(180deg, rgba(255, 255, 255, .85), rgba(250, 249, 247, .8));
  box-shadow: inset 0 1px 2px rgba(0, 0, 0, .08), inset 0 0 0 1.5px rgba(0, 0, 0, .09), 0 1px 0 rgba(255, 255, 255, .9); transition: box-shadow .2s; }
.cfield input:focus { box-shadow: inset 0 1px 2px rgba(0, 0, 0, .06), inset 0 0 0 1.5px var(--accent), 0 0 0 4px rgba(232, 67, 42, .14); }
.fchips { display: flex; flex-wrap: wrap; gap: 6px; }
.fchip { height: 32px; max-width: 100%; display: inline-flex; align-items: center; gap: 6px; padding: 0 11px; border: 0; border-radius: 10px; font-size: 12px; font-weight: 700; color: var(--ink); white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  background-image: var(--noise), linear-gradient(180deg, rgba(255, 255, 255, .8), rgba(244, 242, 238, .65));
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, .95), 0 0 0 1px rgba(0, 0, 0, .07), 0 1px 2px rgba(0, 0, 0, .05); transition: transform .14s var(--ease), box-shadow .2s, color .2s, background .25s; }
.fchip:active { transform: scale(.95); }
.fchip i { width: 8px; height: 8px; border-radius: 3px; flex: none; }
.fchip[aria-checked="true"] { color: #fff; background-image: var(--noise), linear-gradient(180deg, rgba(58, 58, 62, .95), rgba(29, 29, 31, .95)); box-shadow: inset 0 1px 0 rgba(255, 255, 255, .16), 0 0 0 1px rgba(0, 0, 0, .35); }
.fchip.add { color: var(--accent-t); background-image: none; box-shadow: inset 0 0 0 1.5px rgba(0, 0, 0, .14); }
.cedit .two { gap: 8px; margin-top: 2px; }
.cedit .two button { height: 44px; border-radius: 13px; font-size: 13px; }
.mini .ibtn[aria-expanded="true"] { color: #fff; background-image: var(--noise), linear-gradient(180deg, rgba(58, 58, 62, .95), rgba(29, 29, 31, .95)); box-shadow: inset 0 1px 0 rgba(255, 255, 255, .16), 0 0 0 1px rgba(0, 0, 0, .35); }
.mini .ibtn.dl.busy svg { animation: dlpulse .9s ease-in-out infinite; }
@keyframes dlpulse { 50% { transform: translateY(2px); opacity: .5 } }
/* 내려받은 단일 로봇 파일: 첫 화면 없이 바로 조립 보기 */
.single #home { display: none !important; }
.single #back, .single .rule { display: none; }
.single .ttlbar { left: calc(var(--sal) + 16px); }
@media (prefers-reduced-motion: reduce) { *, *::before { animation: none !important; transition: none !important; } }

</style>
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.186.1/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.186.1/examples/jsm/"
      }
    }
  </script>
</head>
<body>
<div id="app">
  <section id="home" class="screen" aria-label="완성 로봇 목록">
    <header class="h-head">
      <div class="h-title"><div class="eyebrow"><span class="bar"></span>ROBOROBO</div><h1>완성 로봇 <small id="count"></small></h1></div>
      <div class="h-acts">
        <button type="button" class="ibtn pr" id="folderMenu" aria-label="이 폴더 설정" hidden>
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="5" cy="12" r="1.3"/><circle cx="12" cy="12" r="1.3"/><circle cx="19" cy="12" r="1.3"/></svg>
        </button>
        <button type="button" class="ibtn solidbtn pr" id="newFolder" aria-label="새 폴더 만들기">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 7.5A1.5 1.5 0 0 1 4.5 6H9l2 2.2h8.5A1.5 1.5 0 0 1 21 9.7v8.8a1.5 1.5 0 0 1-1.5 1.5h-15A1.5 1.5 0 0 1 3 18.5z"/><path d="M12 11.5v5M9.5 14h5"/></svg>
        </button>
      </div>
      <nav class="fbar" id="fbar" role="tablist" aria-label="폴더"></nav>
    </header>
    <div class="cards" id="cards"></div>
    <div class="empty" id="empty" hidden></div>
    <div class="htoast" id="htoast" role="status"></div>
  </section>

  <section id="viewer" class="screen" hidden aria-label="조립 뷰어">
    <main class="stage" id="stage"></main>

    <div class="ttlbar">
      <button type="button" class="backi" id="back" aria-label="로봇 목록으로"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14.5 5.5L8 12l6.5 6.5"/></svg></button>
      <span class="rule" aria-hidden="true"></span>
      <div class="ttl"><b id="vName"></b><span id="vMaker"></span></div>
    </div>

    <div class="trc matte">
      <button type="button" id="modBtn" aria-expanded="false" aria-controls="modPanel" aria-label="모듈 선택"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 4l8 4.5-8 4.5-8-4.5z"/><path d="M4 13l8 4.5 8-4.5"/></svg><span class="mcnt" id="modCnt">0/0</span><svg class="chev" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg></button>
      <span class="vsep" aria-hidden="true"></span>
      <button type="button" id="tune" aria-expanded="false" aria-controls="pop" aria-label="보기 설정"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg></button>
    </div>
    <div class="drop matte" id="modPanel" hidden role="group" aria-label="모듈 보이기">
      <div class="dhead"><span>모듈 · 누르면 숨김</span><button type="button" class="pr" id="showAll">모두 보이기</button></div>
      <div class="mlist" id="mods"></div>
    </div>
    <div class="drop matte" id="pop" hidden role="group" aria-label="보기 설정">
      <div class="dhead"><span>보기 설정</span></div>
      <div class="prow"><span>재생 속도</span><div class="pseg" id="speed" role="group" aria-label="재생 속도"><i class="pill"></i>
        <button type="button" data-v="0.5" aria-pressed="false">0.5×</button><button type="button" data-v="1" aria-pressed="true">1×</button><button type="button" data-v="2" aria-pressed="false">2×</button><button type="button" data-v="4" aria-pressed="false">4×</button>
      </div></div>
      <div class="chips">
        <button type="button" class="chip pr" id="follow" aria-pressed="true"><span class="box"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></span>카메라 따라감</button>
        <button type="button" class="chip pr" id="bolts" aria-pressed="true"><span class="box"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></span>볼트 · 너트</button>
      </div>
    </div>

    <div class="now matte" id="now" aria-live="polite"><i></i><span id="nowText"></span></div>

    <div class="hud player matte" id="player" data-mode="asm">
      <div class="pages" id="pages">
        <div class="page asm on" id="pageAsm">
          <div class="readout r1">
            <div class="counter"><small>STEP</small><b id="stepText">00<em> / 00</em></b></div>
            <span id="stepName"></span>
          </div>
          <div class="scrub r2"><div class="tb" id="tbStep" role="slider" tabindex="0" aria-label="단계로 이동"><canvas></canvas></div></div>
          <div class="tp r3">
            <button type="button" class="rb sm" id="first" aria-label="처음부터"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 5v14"/><path d="M18 6.5l-8.5 5.5 8.5 5.5z"/></svg></button>
            <button type="button" class="rb" id="prev" aria-label="이전 단계 (길게 누르면 계속)"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15.5 6L8.5 12l7 6z" fill="currentColor"/></svg></button>
            <div class="playwrap"><button type="button" class="play" id="play" aria-label="재생">
              <svg class="i-play" width="26" height="26" viewBox="0 0 24 24" aria-hidden="true"><path d="M7.5 4.8c0-.8.9-1.3 1.6-.9l10 6.2c.7.4.7 1.4 0 1.8l-10 6.2c-.7.4-1.6-.1-1.6-.9z" fill="currentColor"/></svg>
              <svg class="i-pause" width="24" height="24" viewBox="0 0 24 24" aria-hidden="true"><rect x="6.5" y="5" width="3.6" height="14" rx="1.2" fill="currentColor"/><rect x="13.9" y="5" width="3.6" height="14" rx="1.2" fill="currentColor"/></svg>
            </button></div>
            <button type="button" class="rb" id="next" aria-label="다음 단계 (길게 누르면 계속)"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8.5 6l7 6-7 6z" fill="currentColor"/></svg></button>
            <button type="button" class="rb sm" id="last" aria-label="완성 상태로"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 5v14"/><path d="M6 6.5l8.5 5.5L6 17.5z"/></svg></button>
          </div>
          <div class="exrow2 r4">
            <div class="fhead"><span class="flab"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v4M12 17v4M3 12h4M17 12h4"/><rect x="9" y="9" width="6" height="6" rx="1"/></svg>분해 보기</span><output id="exVal">0%</output></div>
            <div class="tb sm" id="tbEx" role="slider" tabindex="0" aria-label="분해 보기"><canvas></canvas></div>
          </div>
        </div>
        <div class="page fn off" id="pageFn" aria-hidden="true">
          <div class="fhd r1"><div class="ftitle"><small>FUNCTION</small><b id="fnTitle">기능 조작</b></div><div class="stats" id="fnStats"></div></div>
          <div class="fgrid" id="fnGrid"></div>
        </div>
      </div>
      <button type="button" class="modesw" id="modeSw">
        <span class="msic" aria-hidden="true"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M13 3L5 13.5h6L10 21l8-10.5h-6z"/></svg></span>
        <span class="mslab"><b id="modeLab">기능 조작</b><small id="modeSub">조립이 끝나면 자동으로 넘어가요</small></span>
        <span class="mschev" aria-hidden="true"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg></span>
      </button>
    </div>

    <div class="toast" id="toast" role="status"></div>
    <div class="tip" id="tip"></div>
    <div class="loading matte" id="loading" hidden><b id="lText">부품 불러오는 중</b><div class="lbar"><i id="lFill"></i></div><span id="lPct">0%</span></div>
  </section>

  <div class="modal" id="modal" hidden>
    <button type="button" class="scrim" id="scrim" aria-label="닫기"></button>
    <form class="sheet" id="sheet" role="dialog" aria-modal="true" novalidate></form>
  </div>
</div>
