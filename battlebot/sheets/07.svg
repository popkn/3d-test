<text x="58.0" y="414.0" font-size="9.5" fill="#8a919c" font-weight="400" text-anchor="start">지면</text>
<rect x="279.9" y="356.3" width="165.11" height="3.04" fill="#2b2c30"/>
<circle cx="335.0" cy="337.3" r="57.0" fill="none" stroke="#b9c2cf"/><circle cx="506.0" cy="337.3" r="57.0" fill="none" stroke="#b9c2cf"/>
<line x1="316.0" y1="356.3" x2="174.4" y2="400.0" stroke="#1d2230" stroke-width="4.0" stroke-opacity="1"/>
<text x="164.4" y="392.0" font-size="10" fill="#1d2230" font-weight="700" text-anchor="start">17° 내림 (앞 끝 지면)</text>
<line x1="316.0" y1="356.3" x2="207.3" y2="255.5" stroke="#e8432a" stroke-width="4.0" stroke-opacity="0.7"/>
<text x="197.3" y="247.5" font-size="10" fill="#e8432a" font-weight="700" text-anchor="start">60° 들어올림</text>
<circle cx="316.0" cy="356.3" r="4" fill="#f2c21b" stroke="#1d2230"/>
<rect x="242.85000000000002" y="252.56000000000003" width="184.29999999999998" height="3.04" fill="#f4f3ee" stroke="#c8202b"/>
<text x="242.9" y="246.6" font-size="9.5" fill="#c8202b" font-weight="700" text-anchor="start">스피너 날 Ø97 (y=76.8 · 웨지 여유 +18.2 mm)</text>
<text x="650.0" y="104.0" font-size="12" fill="#1d2230" font-weight="700" text-anchor="start">② 무한궤도 조종 (위에서, 위 = 앞)</text>
<rect x="650" y="110" width="560" height="330" fill="url(#g)" stroke="#aab4c3" stroke-dasharray="4 3"/>
<rect x="827.0" y="202.0" width="22.0" height="156.0" fill="#2b2c30"/>
<rect x="1011.0" y="202.0" width="22.0" height="156.0" fill="#2b2c30"/>
<rect x="851.0" y="226.0" width="158.0" height="118.0" fill="none" stroke="#1d2230"/>
<circle cx="930" cy="235.0" r="48.5" fill="none" stroke="#c8202b" stroke-dasharray="3 2"/>
<text x="662.0" y="430.0" font-size="10" fill="#3a7bd5" font-weight="700" text-anchor="start">궤도 속도 0.42 m/s · 마디 38×2 · 스피너 날 끝 2.03 m/s</text>
<text x="50.0" y="480.0" font-size="12" fill="#1d2230" font-weight="700" text-anchor="start">③ V2 설계 수치 &amp; 규칙 검증</text>
<rect x="50" y="494" width="560" height="28" fill="#eef2f7"/>
<text x="60.0" y="512.0" font-size="10.5" fill="#1d2230" font-weight="700" text-anchor="start">전체 크기</text>
<text x="175.0" y="512.0" font-size="10" fill="#1d2230" font-weight="400" text-anchor="start">214 × 108 × 222 mm (폭 × 높이 × 길이)</text>
<text x="60.0" y="540.0" font-size="10.5" fill="#1d2230" font-weight="700" text-anchor="start">무게 (추정)</text>
<text x="175.0" y="540.0" font-size="10" fill="#1d2230" font-weight="400" text-anchor="start">약 1093 g (배터리·모터 저중심)</text>
<rect x="50" y="550" width="560" height="28" fill="#eef2f7"/>
<text x="60.0" y="568.0" font-size="10.5" fill="#1d2230" font-weight="700" text-anchor="start">실체 배치</text>
<text x="175.0" y="568.0" font-size="10" fill="#1d2230" font-weight="400" text-anchor="start">구조 245 + 체결 243 = 488개 (실체 BOM 498개)</text>
<text x="60.0" y="596.0" font-size="10.5" fill="#1d2230" font-weight="700" text-anchor="start">규칙 3/4.2/10.2</text>
<text x="175.0" y="596.0" font-size="10" fill="#1d2230" font-weight="400" text-anchor="start">motor-drive-set 세트 통합 · RGB 클립 직결 · 캡너트 동축 정렬</text>
<rect x="50" y="606" width="560" height="28" fill="#eef2f7"/>
<text x="60.0" y="624.0" font-size="10.5" fill="#1d2230" font-weight="700" text-anchor="start">규칙 10.3/10.7</text>
<text x="175.0" y="624.0" font-size="10" fill="#1d2230" font-weight="400" text-anchor="start">연속 볼트·너트 1단계 그룹화 · 웨지↔스피너 스윕 여유 +18.2 mm</text>
<text x="650.0" y="480.0" font-size="12" fill="#1d2230" font-weight="700" text-anchor="start">④ 동작 · 안전</text>
<rect x="650" y="494" width="560" height="40" fill="#eef2f7"/>
<text x="660.0" y="510.0" font-size="10.5" fill="#e8432a" font-weight="700" text-anchor="start">조종 (블루투스)</text>
<text x="785.0" y="510.0" font-size="9.5" fill="#1d2230" font-weight="400" text-anchor="start">스마트폰 버튼: 전진 · 후진 · 좌우 회전 (궤도 좌우 속도 차이) · 웨지 올림 · 스피너 켜</text>
<text x="660.0" y="550.0" font-size="10.5" fill="#e8432a" font-weight="700" text-anchor="start">페일세이프</text>
<text x="785.0" y="550.0" font-size="9.5" fill="#1d2230" font-weight="400" text-anchor="start">블루투스 신호가 0.5초 끊기면 스피너 · 구동 모터 정지, 웨지 내림, 램프 파랑 깜빡</text>
<rect x="650" y="574" width="560" height="40" fill="#eef2f7"/>
<text x="660.0" y="590.0" font-size="10.5" fill="#e8432a" font-weight="700" text-anchor="start">스피너 시작</text>
<text x="785.0" y="590.0" font-size="9.5" fill="#1d2230" font-weight="400" text-anchor="start">부저 2번 경고 → 1초 뒤 회전 (빨강 램프)</text>
<text x="660.0" y="630.0" font-size="10.5" fill="#e8432a" font-weight="700" text-anchor="start">자동 공격 (IN3)</text>
<text x="785.0" y="630.0" font-size="9.5" fill="#1d2230" font-weight="400" text-anchor="start">앞에 상대가 오면 눈 LED 켜고 웨지를 내린 채 돌진, 닿으면 웨지 60°로 들어 상대를 스피너</text>
<rect x="650" y="654" width="560" height="40" fill="#eef2f7"/>
<text x="660.0" y="670.0" font-size="10.5" fill="#e8432a" font-weight="700" text-anchor="start">경계선 (IN4)</text>
<text x="785.0" y="670.0" font-size="9.5" fill="#1d2230" font-weight="400" text-anchor="start">흰 선을 보면 0.5초 후진 후 90° 회전 (조종보다 우선)</text>
<text x="660.0" y="710.0" font-size="10.5" fill="#e8432a" font-weight="700" text-anchor="start">뒤 범퍼 (IN1 · IN2)</text>
<text x="785.0" y="710.0" font-size="9.5" fill="#1d2230" font-weight="400" text-anchor="start">맞은 쪽 반대로 피하며 부저 짧게, 맞은 횟수를 램프 색으로 표시</text></svg>