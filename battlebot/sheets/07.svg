<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1260 900" width="1260" height="900" font-family="JetBrains Mono, 'Noto Sans KR', sans-serif"><defs><pattern id="g" width="10" height="10" patternUnits="userSpaceOnUse"><path d="M10 0H0V10" fill="none" stroke="#e3e8ef" stroke-width="0.5"/></pattern></defs><rect width="100%" height="100%" fill="#f6f8fb"/><rect x="14" y="14" width="1232" height="872" fill="none" stroke="#1d2230" stroke-width="1.2"/>
<rect x="14" y="14" width="1232" height="46" fill="#1d2230"/>
<text x="28.0" y="44.0" font-size="13" fill="#9fb3d1" font-weight="700" text-anchor="start">배틀로봇 썬더 웨지 · 도면 07</text>
<text x="279.0" y="44.0" font-size="17" fill="#ffffff" font-weight="700" text-anchor="start">동작도 (속도 · 무기 · 조종 · 안전)</text>
<text x="1232.0" y="44.0" font-size="10.5" fill="#c8d3e6" font-weight="400" text-anchor="end">조사한 설계 원리: 낮은 차체 · 웨지 + 스피너 · 페일세이프</text>
<text x="50.0" y="104.0" font-size="12" fill="#1d2230" font-weight="700" text-anchor="start">① 들어올림 웨지 (오른쪽에서, 왼쪽 = 앞)</text>
<rect x="50" y="110" width="560" height="330" fill="url(#g)" stroke="#aab4c3" stroke-dasharray="4 3"/>
<line x1="50" y1="400" x2="610" y2="400" stroke="#8a919c" stroke-width="1.5"/>
<text x="58.0" y="414.0" font-size="9.5" fill="#8a919c" font-weight="400" text-anchor="start">지면</text>
<rect x="279.9" y="356.3" width="165.11" height="3.04" fill="#2b2c30"/>
<circle cx="335.0" cy="337.3" r="57.0" fill="none" stroke="#b9c2cf"/><circle cx="525.0" cy="337.3" r="57.0" fill="none" stroke="#b9c2cf"/>
<line x1="316.0" y1="356.3" x2="174.4" y2="400.0" stroke="#1d2230" stroke-width="4.0" stroke-opacity="1"/>
<text x="164.4" y="392.0" font-size="10" fill="#1d2230" font-weight="700" text-anchor="start">17° 내림 (앞 끝 지면)</text>
<line x1="316.0" y1="356.3" x2="241.9" y2="228.0" stroke="#e8432a" stroke-width="4.0" stroke-opacity="0.6"/>
<text x="231.9" y="220.0" font-size="10" fill="#e8432a" font-weight="700" text-anchor="start">60° 들어올림</text>
<circle cx="316.0" cy="356.3" r="4" fill="#f2c21b" stroke="#1d2230"/>
<text x="322.0" y="372.3" font-size="9.5" fill="#3a4050" font-weight="400" text-anchor="start">회전 핀 (후크 S35)</text>
<rect x="255.20000000000002" y="260.53999999999996" width="159.6" height="5.699999999999999" fill="#f4f3ee" stroke="#c8202b"/>
<text x="255.2" y="254.5" font-size="9.5" fill="#c8202b" font-weight="700" text-anchor="start">스피너 날 (높이 72 mm, 반지름 42)</text>
<text x="60.0" y="430.0" font-size="10" fill="#3a7bd5" font-weight="700" text-anchor="start">웨지가 상대를 들어 올리면 → 스피너 날 높이로 올라와 맞는다 (웨지 + 스피너 조합)</text>
<text x="650.0" y="104.0" font-size="12" fill="#1d2230" font-weight="700" text-anchor="start">② 무한궤도 조종 (위에서, 위 = 앞)</text>
<rect x="650" y="110" width="560" height="330" fill="url(#g)" stroke="#aab4c3" stroke-dasharray="4 3"/>
<rect x="827.0" y="202.0" width="22.0" height="166.0" fill="#2b2c30"/>
<rect x="1011.0" y="202.0" width="22.0" height="166.0" fill="#2b2c30"/>
<rect x="851.0" y="226.0" width="158.0" height="118.0" fill="none" stroke="#1d2230"/>
<circle cx="930" cy="235.0" r="42.0" fill="none" stroke="#c8202b" stroke-dasharray="3 2"/>
<text x="1060.0" y="140.0" font-size="11" fill="#1d2230" font-weight="700" text-anchor="start">↑ 전진</text>
<text x="1060.0" y="154.0" font-size="9.5" fill="#5a6070" font-weight="400" text-anchor="start">M1 + / M2 +</text>
<text x="1060.0" y="180.0" font-size="11" fill="#1d2230" font-weight="700" text-anchor="start">↓ 후진</text>
<text x="1060.0" y="194.0" font-size="9.5" fill="#5a6070" font-weight="400" text-anchor="start">M1 − / M2 −</text>
<text x="1060.0" y="220.0" font-size="11" fill="#1d2230" font-weight="700" text-anchor="start">↺ 제자리 왼쪽 회전</text>
<text x="1060.0" y="234.0" font-size="9.5" fill="#5a6070" font-weight="400" text-anchor="start">M1 − / M2 +</text>
<text x="1060.0" y="260.0" font-size="11" fill="#1d2230" font-weight="700" text-anchor="start">↻ 제자리 오른쪽 회전</text>
<text x="1060.0" y="274.0" font-size="9.5" fill="#5a6070" font-weight="400" text-anchor="start">M1 + / M2 −</text>
<text x="662.0" y="430.0" font-size="10" fill="#3a7bd5" font-weight="700" text-anchor="start">궤도 속도 = 130 rpm × π × 62 mm = 0.42 m/s · 궤도 폭 22 · 접지 길이 약 100 mm</text>
<text x="50.0" y="480.0" font-size="12" fill="#1d2230" font-weight="700" text-anchor="start">③ 설계 수치 (추정 포함)</text>
<rect x="50" y="494" width="560" height="24" fill="#eef2f7"/>
<text x="60.0" y="510.0" font-size="10.5" fill="#1d2230" font-weight="700" text-anchor="start">전체 크기</text>
<text x="160.0" y="510.0" font-size="10" fill="#1d2230" font-weight="400" text-anchor="start">210 × 110 × 230 mm (폭 × 높이 × 길이)</text>
<text x="60.0" y="534.0" font-size="10.5" fill="#1d2230" font-weight="700" text-anchor="start">무게 (추정)</text>
<text x="160.0" y="534.0" font-size="10" fill="#1d2230" font-weight="400" text-anchor="start">약 1067 g, 배터리 · 모터가 낮고 가운데</text>
<rect x="50" y="542" width="560" height="24" fill="#eef2f7"/>
<text x="60.0" y="558.0" font-size="10.5" fill="#1d2230" font-weight="700" text-anchor="start">지면 높이</text>
<text x="160.0" y="558.0" font-size="10" fill="#1d2230" font-weight="400" text-anchor="start">바닥판 21.4 mm · 바닥 센서 6 mm</text>
<text x="60.0" y="582.0" font-size="10.5" fill="#1d2230" font-weight="700" text-anchor="start">궤도</text>
<text x="160.0" y="582.0" font-size="10" fill="#1d2230" font-weight="400" text-anchor="start">마디 40개 × 2, 러버 40개 × 2, 속도 0.42 m/s</text>
<rect x="50" y="590" width="560" height="24" fill="#eef2f7"/>
<text x="60.0" y="606.0" font-size="10.5" fill="#1d2230" font-weight="700" text-anchor="start">스피너</text>
<text x="160.0" y="606.0" font-size="10" fill="#1d2230" font-weight="400" text-anchor="start">DC 400 rpm, 십자 날 Ø84, 날 끝 1.76 m/s, 회전 에너지 약 17 mJ</text>
<text x="60.0" y="630.0" font-size="10.5" fill="#1d2230" font-weight="700" text-anchor="start">웨지</text>
<text x="160.0" y="630.0" font-size="10" fill="#1d2230" font-weight="400" text-anchor="start">메인 PCB 118 × 78, 17° ~ 60°, 서보 4 kg·cm · 크랭크 반지름 10 mm</text>
<rect x="50" y="638" width="560" height="24" fill="#eef2f7"/>
<text x="60.0" y="654.0" font-size="10.5" fill="#1d2230" font-weight="700" text-anchor="start">무게 중심</text>
<text x="160.0" y="654.0" font-size="10" fill="#1d2230" font-weight="400" text-anchor="start">배터리 (y 32) · 모터 (y 33)가 가장 낮음 → 뒤집히기 어려움 (조사: 스피너 로봇은 낮게)</text>
<text x="650.0" y="480.0" font-size="12" fill="#1d2230" font-weight="700" text-anchor="start">④ 동작 · 안전</text>
<rect x="650" y="494" width="560" height="44" fill="#eef2f7"/>
<text x="660.0" y="511.0" font-size="10.5" fill="#e8432a" font-weight="700" text-anchor="start">조종 (블루투스)</text>
<text x="790.0" y="509.0" font-size="9.5" fill="#1d2230" font-weight="400" text-anchor="start">스마트폰 버튼: 전진 · 후진 · 좌우 회전 (궤도 좌우 속도 차이) · 웨지</text>
<text x="790.0" y="522.0" font-size="9.5" fill="#1d2230" font-weight="400" text-anchor="start">올림 · 스피너 켜기/끄기</text>
<text x="660.0" y="555.0" font-size="10.5" fill="#e8432a" font-weight="700" text-anchor="start">페일세이프</text>
<text x="790.0" y="553.0" font-size="9.5" fill="#1d2230" font-weight="400" text-anchor="start">블루투스 신호가 0.5초 끊기면 스피너 · 구동 모터 정지, 웨지 내림, 램프</text>
<text x="790.0" y="566.0" font-size="9.5" fill="#1d2230" font-weight="400" text-anchor="start">파랑 깜빡 (조사: 무기 정지 장치는 대회 필수)</text>
<rect x="650" y="582" width="560" height="44" fill="#eef2f7"/>
<text x="660.0" y="599.0" font-size="10.5" fill="#e8432a" font-weight="700" text-anchor="start">스피너 시작</text>
<text x="790.0" y="597.0" font-size="9.5" fill="#1d2230" font-weight="400" text-anchor="start">부저 2번 경고 → 1초 뒤 회전 (빨강 램프)</text>
<text x="660.0" y="643.0" font-size="10.5" fill="#e8432a" font-weight="700" text-anchor="start">자동 공격 (IN3)</text>
<text x="790.0" y="641.0" font-size="9.5" fill="#1d2230" font-weight="400" text-anchor="start">앞에 상대가 오면 눈 LED 켜고 웨지를 내린 채 돌진, 닿으면 웨지 60°로</text>
<text x="790.0" y="654.0" font-size="9.5" fill="#1d2230" font-weight="400" text-anchor="start">들어 상대를 스피너 쪽으로</text>
<rect x="650" y="670" width="560" height="44" fill="#eef2f7"/>
<text x="660.0" y="687.0" font-size="10.5" fill="#e8432a" font-weight="700" text-anchor="start">경계선 (IN4)</text>
<text x="790.0" y="685.0" font-size="9.5" fill="#1d2230" font-weight="400" text-anchor="start">흰 선을 보면 0.5초 후진 후 90° 회전 (조종보다 우선)</text>
<text x="660.0" y="731.0" font-size="10.5" fill="#e8432a" font-weight="700" text-anchor="start">뒤 범퍼 (IN1 · IN2)</text>
<text x="790.0" y="729.0" font-size="9.5" fill="#1d2230" font-weight="400" text-anchor="start">맞은 쪽 반대로 피하며 부저 짧게, 맞은 횟수를 램프 색으로 표시</text></svg>