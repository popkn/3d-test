<text x="60.0" y="910.0" font-size="10" fill="#3a4050" font-weight="400" text-anchor="start">DC 모터 6개 = CPU 최대 (조작 4 + 계속 회전 2) · 확장 보드 없이 연결. 무기 2개는 전원을 켜면 바로 도니 켜기 전에 주변을 비운다.</text>
<text x="60.0" y="928.0" font-size="10" fill="#3a4050" font-weight="400" text-anchor="start">모터 6개가 한꺼번에 돌면 AA 4개로는 금방 약해진다 → 새 건전지 · 충전지를 쓰고, 케이블은 바퀴 · 무기에 닿지 않게 상판 아래로.</text></svg>