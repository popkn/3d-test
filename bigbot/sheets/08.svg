<text x="343.7" y="44.0" font-size="17" fill="#ffffff" font-weight="700" text-anchor="start">규칙 검사 · 모터 배정 · 동작</text>
<text x="1232.0" y="44.0" font-size="10.5" fill="#c8d3e6" font-weight="400" text-anchor="end">ASSEMBLY_RULES.md 기본 규칙 (CPU · 모터 · 전기 연결)</text>
<text x="50.0" y="100.0" font-size="13" fill="#1d2230" font-weight="700" text-anchor="start">① 기본 규칙 검사</text>
<rect x="50" y="114" width="560" height="26" fill="#eef2f7"/>
<text x="60.0" y="131.0" font-size="10.5" fill="#1f8a50" font-weight="700" text-anchor="start">✔ 1.1 CPU 1대당 1개</text>
<text x="270.0" y="131.0" font-size="10" fill="#1d2230" font-weight="400" text-anchor="start">CPU 보드 1개</text>
<text x="60.0" y="157.0" font-size="10.5" fill="#1f8a50" font-weight="700" text-anchor="start">✔ 2.1 CPU 모터 최대 6</text>
<text x="270.0" y="157.0" font-size="10" fill="#1d2230" font-weight="400" text-anchor="start">DC 모터 6개 (130 × 4 + 400 × 2)</text>
<rect x="50" y="166" width="560" height="26" fill="#eef2f7"/>
<text x="60.0" y="183.0" font-size="10.5" fill="#1f8a50" font-weight="700" text-anchor="start">✔ 2.1 조작 가능 4</text>
<text x="270.0" y="183.0" font-size="10" fill="#1d2230" font-weight="400" text-anchor="start">구동 모터 4개 → M1 ~ M4</text>
<text x="60.0" y="209.0" font-size="10.5" fill="#1f8a50" font-weight="700" text-anchor="start">✔ 2.1 조작 불가 2 (계속 회전)</text>
<text x="270.0" y="209.0" font-size="10" fill="#1d2230" font-weight="400" text-anchor="start">무기 모터 2개 → 계속 회전 자리 1 · 2</text>
<rect x="50" y="218" width="560" height="26" fill="#eef2f7"/>
<text x="60.0" y="235.0" font-size="10.5" fill="#1f8a50" font-weight="700" text-anchor="start">✔ 2.2 확장 보드 (+4)</text>
<text x="270.0" y="235.0" font-size="10" fill="#1d2230" font-weight="400" text-anchor="start">필요 없음 (조작 모터 4개) · 키트에 1개 남음</text>
<text x="60.0" y="261.0" font-size="10.5" fill="#1f8a50" font-weight="700" text-anchor="start">✔ 2.3 수량 130 × 4</text>
<text x="270.0" y="261.0" font-size="10" fill="#1d2230" font-weight="400" text-anchor="start">130 모터 4개 사용</text>
<rect x="50" y="270" width="560" height="26" fill="#eef2f7"/>
<text x="60.0" y="287.0" font-size="10.5" fill="#1f8a50" font-weight="700" text-anchor="start">✔ 2.3 수량 400 × 2</text>
<text x="270.0" y="287.0" font-size="10" fill="#1d2230" font-weight="400" text-anchor="start">400 모터 2개 사용</text>
<text x="60.0" y="313.0" font-size="10.5" fill="#1f8a50" font-weight="700" text-anchor="start">✔ 2.4 배틀 무기 = 400 모터</text>
<text x="270.0" y="313.0" font-size="10" fill="#1d2230" font-weight="400" text-anchor="start">앞 스피너 · 뒤 드럼 모두 400 모터</text>
<rect x="50" y="322" width="560" height="26" fill="#eef2f7"/>
<text x="60.0" y="339.0" font-size="10.5" fill="#1f8a50" font-weight="700" text-anchor="start">✔ 7 입력 IN</text>
<text x="270.0" y="339.0" font-size="10" fill="#1d2230" font-weight="400" text-anchor="start">접촉 센서 2 · 적외선 센서 1 (포트 하나에 하나)</text>
<text x="60.0" y="365.0" font-size="10.5" fill="#1f8a50" font-weight="700" text-anchor="start">✔ 7 출력 OUT</text>
<text x="270.0" y="365.0" font-size="10" fill="#1d2230" font-weight="400" text-anchor="start">서보 1 · LED 빨강 2 · 부저 1 · LED 초록 1</text>
<rect x="50" y="374" width="560" height="26" fill="#eef2f7"/>
<text x="60.0" y="391.0" font-size="10.5" fill="#1f8a50" font-weight="700" text-anchor="start">✔ 3 세트 부품</text>
<text x="270.0" y="391.0" font-size="10" fill="#1d2230" font-weight="400" text-anchor="start">바퀴 = 버기 바퀴 세트 6 (휠 · 인너 · 타이어 따로 조립 안 함)</text>
<text x="60.0" y="417.0" font-size="10.5" fill="#1f8a50" font-weight="700" text-anchor="start">✔ 4 구멍 Ø3.2 · 5 mm 격자</text>
<text x="270.0" y="417.0" font-size="10" fill="#1d2230" font-weight="400" text-anchor="start">모든 판 · 보드 체결은 격자 구멍</text>
<text x="650.0" y="100.0" font-size="13" fill="#1d2230" font-weight="700" text-anchor="start">② 모터 배정 (위에서, 위 = 앞)</text>
