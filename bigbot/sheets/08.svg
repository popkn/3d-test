<text x="472.3" y="605.9" font-size="9.5" fill="#c8202b" font-weight="700" text-anchor="start">드럼 (세로로 돎)</text>
<line x1="173.04" y1="666.4" x2="92.4" y2="700.0" stroke="#1d2230" stroke-width="3" stroke-opacity=".8"/>
<line x1="173.04" y1="666.4" x2="111.3" y2="604.6" stroke="#e8432a" stroke-width="3" stroke-opacity=".8"/>
<text x="60.0" y="725.0" font-size="9.5" fill="#3a7bd5" font-weight="700" text-anchor="start">웨지 23° (지면) → 45° : 들어 올린 상대가 스피너 날 높이로 · 45°를 넘으면 날에 닿으니 서보 각도 제한</text>
<text x="650.0" y="470.0" font-size="13" fill="#1d2230" font-weight="700" text-anchor="start">④ 동작 · 안전</text>
<rect x="650" y="484" width="560" height="44" fill="#eef2f7"/>
<text x="660.0" y="501.0" font-size="10.5" fill="#e8432a" font-weight="700" text-anchor="start">조종 (블루투스)</text>
<text x="800.0" y="499.0" font-size="9.5" fill="#1d2230" font-weight="400" text-anchor="start">전진 · 후진 · 제자리 회전 (왼쪽 M1·M2 / 오른쪽 M3·M4 묶음</text>
<text x="800.0" y="512.0" font-size="9.5" fill="#1d2230" font-weight="400" text-anchor="start">속도 차이) · 웨지 올림/내림</text>
<text x="660.0" y="545.0" font-size="10.5" fill="#e8432a" font-weight="700" text-anchor="start">무기 (계속 회전)</text>
<text x="800.0" y="543.0" font-size="9.5" fill="#1d2230" font-weight="400" text-anchor="start">스피너 · 드럼은 조작 불가 자리라 전원을 켜면 바로 돈다 → 켜기 전 주변</text>
<text x="800.0" y="556.0" font-size="9.5" fill="#1d2230" font-weight="400" text-anchor="start">확인, 끌 때는 전원 스위치</text>
<rect x="650" y="572" width="560" height="44" fill="#eef2f7"/>
<text x="660.0" y="589.0" font-size="10.5" fill="#e8432a" font-weight="700" text-anchor="start">전원 켤 때</text>
<text x="800.0" y="587.0" font-size="9.5" fill="#1d2230" font-weight="400" text-anchor="start">부저 3번 경고 · 초록 LED가 켜지면 조종 가능</text>
<text x="660.0" y="633.0" font-size="10.5" fill="#e8432a" font-weight="700" text-anchor="start">공격 (IN1)</text>
<text x="800.0" y="631.0" font-size="9.5" fill="#1d2230" font-weight="400" text-anchor="start">앞에 상대가 오면 눈 LED 켜짐 → 웨지를 내린 채 밀고 들어가 웨지로 들어</text>
<text x="800.0" y="644.0" font-size="9.5" fill="#1d2230" font-weight="400" text-anchor="start">스피너 높이로</text>
<rect x="650" y="660" width="560" height="44" fill="#eef2f7"/>
<text x="660.0" y="677.0" font-size="10.5" fill="#e8432a" font-weight="700" text-anchor="start">뒤 방어 (IN2 · IN3)</text>
<text x="800.0" y="675.0" font-size="9.5" fill="#1d2230" font-weight="400" text-anchor="start">뒤에서 맞으면 부저 짧게 · 맞은 쪽 반대로 피함. 뒤에 붙은 상대는 수직</text>
<text x="800.0" y="688.0" font-size="9.5" fill="#1d2230" font-weight="400" text-anchor="start">드럼이 침</text>
<text x="660.0" y="721.0" font-size="10.5" fill="#e8432a" font-weight="700" text-anchor="start">6륜 장점</text>
<text x="800.0" y="719.0" font-size="9.5" fill="#1d2230" font-weight="400" text-anchor="start">가운데 바퀴가 차체 아래 받쳐서 웨지에 올라타기 어렵고, 턱 · 경사에서 덜</text>
<text x="800.0" y="732.0" font-size="9.5" fill="#1d2230" font-weight="400" text-anchor="start">걸림</text></svg>