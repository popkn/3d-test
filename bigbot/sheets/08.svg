<rect x="1010" y="164" width="14" height="14" fill="#c8202b"/>
<text x="1030.0" y="176.0" font-size="10" fill="#1d2230" font-weight="400" text-anchor="start">빨강 = 계속 회전 (무기, 400)</text>
<rect x="1010" y="188" width="14" height="14" fill="#9a9ca0"/>
<text x="1030.0" y="200.0" font-size="10" fill="#1d2230" font-weight="400" text-anchor="start">회색 = 지지 바퀴 (모터 없음)</text>
<text x="1010.0" y="240.0" font-size="10.5" fill="#1d2230" font-weight="700" text-anchor="start">전진</text>
<text x="1010.0" y="254.0" font-size="9.5" fill="#5a6070" font-weight="400" text-anchor="start">M1 M2 + / M3 M4 +</text>
<text x="1010.0" y="274.0" font-size="10.5" fill="#1d2230" font-weight="700" text-anchor="start">후진</text>
<text x="1010.0" y="288.0" font-size="9.5" fill="#5a6070" font-weight="400" text-anchor="start">모두 −</text>
<text x="1010.0" y="308.0" font-size="10.5" fill="#1d2230" font-weight="700" text-anchor="start">왼쪽 제자리</text>
<text x="1010.0" y="322.0" font-size="9.5" fill="#5a6070" font-weight="400" text-anchor="start">M1 M2 − / M3 M4 +</text>
<text x="1010.0" y="342.0" font-size="10.5" fill="#1d2230" font-weight="700" text-anchor="start">오른쪽 제자리</text>
<text x="1010.0" y="356.0" font-size="9.5" fill="#5a6070" font-weight="400" text-anchor="start">M1 M2 + / M3 M4 −</text>
