<text x="980.0" y="907.0" font-size="9.5" fill="#1f8a50" font-weight="700" text-anchor="start">✔ X 5.0 / Z 1.5 mm</text>
<rect x="45" y="915" width="1170" height="24" fill="#eef2f7"/>
<text x="55.0" y="931.0" font-size="9.8" fill="#1d2230" font-weight="700" text-anchor="start">모터 확장 보드 ↔ LED / 서보 / 뒤 기둥</text>
<text x="340.0" y="931.0" font-size="9.4" fill="#1d2230" font-weight="400" text-anchor="start">확장 보드 x=[-57.5,-7.5], z=[7.5,57.5] · 구멍 (-55/-15, 15/55) 격자 일치</text>
<text x="980.0" y="931.0" font-size="9.5" fill="#1f8a50" font-weight="700" text-anchor="start">✔ 충돌 0 · 오차 0.0 mm</text>
<text x="55.0" y="955.0" font-size="9.8" fill="#1d2230" font-weight="700" text-anchor="start">고각 4절 링크 기구학 (0°~+9.2°)</text>
<text x="340.0" y="955.0" font-size="9.4" fill="#1d2230" font-weight="400" text-anchor="start">서보 y=38.0 (L자 2·3번 구멍) · 소5 링크 30 mm · 경첩 날개 실연동</text>
<text x="980.0" y="955.0" font-size="9.5" fill="#1f8a50" font-weight="700" text-anchor="start">✔ 전 구간 오차 &lt; 0.04 mm</text>
<text x="45.0" y="985.0" font-size="12.2" fill="#c8202b" font-weight="700" text-anchor="start">⑥ 학습 가이드 — 고무줄이 실제로 장전 · 격발되는 4단계 원리</text>
<rect x="45" y="1001" width="1170" height="36" rx="4" fill="#f7f9fc" stroke="#d9e0ea"/>
<text x="58.0" y="1016.0" font-size="10.0" fill="#2f6fe0" font-weight="700" text-anchor="start">1단계 · 거치 연장 (L자 2×1)</text>
<text x="285.0" y="1024.0" font-size="9.5" fill="#1d2230" font-weight="400" text-anchor="start">배럴(r=25)에 동축 고정된 L자 2×1이 바깥쪽 r=35 mm 개방 공간으로 팔을 뻗어, 고무줄이 뒤 케이지 판이나 배럴 몸통에 걸리지 않게 띄워 줍니다.</text>
<rect x="45" y="1043" width="1170" height="36" rx="4" fill="#f7f9fc" stroke="#d9e0ea"/>
<text x="58.0" y="1058.0" font-size="10.0" fill="#2f6fe0" font-weight="700" text-anchor="start">2단계 · 뒤 거치 &amp; 이탈 돔 (걸쇠 캡너트)</text>
<text x="285.0" y="1066.0" font-size="9.5" fill="#1d2230" font-weight="400" text-anchor="start">r=35 mm 끝에 캡너트를 둥근 돔이 뒤(+Z)를 향하게 체결합니다. 장전 시 고무줄은 앞(−Z)으로 당겨지므로 L자 턱에 걸려 안정적으로 유지됩니다.</text>
<rect x="45" y="1085" width="1170" height="36" rx="4" fill="#f7f9fc" stroke="#d9e0ea"/>
<text x="58.0" y="1100.0" font-size="10.0" fill="#2f6fe0" font-weight="700" text-anchor="start">3단계 · 앞 거치 &amp; 노즐 (총구 캡너트)</text>
<text x="285.0" y="1108.0" font-size="9.5" fill="#1d2230" font-weight="400" text-anchor="start">총구 끝(z=−74.5)에 캡너트를 둥근 돔이 앞(−Z)을 향하게 체결합니다. 앞쪽에는 로터 판도 앞 축 받침도 없어 발사 시 장애물이 전혀 없습니다.</text>
<rect x="45" y="1127" width="1170" height="36" rx="4" fill="#fff6f5" stroke="#d9e0ea"/>
<text x="58.0" y="1142.0" font-size="10.0" fill="#c8202b" font-weight="700" text-anchor="start">4단계 · 12시 트리거 이탈 (36.9° 쐐기)</text>
<text x="285.0" y="1150.0" font-size="9.5" fill="#1d2230" font-weight="400" text-anchor="start">로터가 돌며 12시를 좌측(−X)으로 지날 때, 걸쇠 캡너트 위 1.2 mm 틈의 36.9° 쐐기가 고무줄 고리만 뒤(+Z)로 밀어 둥근 돔에서 벗겨 전방 발사합니다.</text></svg>