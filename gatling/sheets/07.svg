<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1260 860" width="1260" height="860" font-family="JetBrains Mono, 'Noto Sans KR', sans-serif"><defs><pattern id="g" width="10" height="10" patternUnits="userSpaceOnUse"><path d="M10 0H0V10" fill="none" stroke="#e3e8ef" stroke-width="0.5"/></pattern></defs><rect width="100%" height="100%" fill="#f6f8fb"/><rect x="14" y="14" width="1232" height="832" fill="none" stroke="#1d2230" stroke-width="1.2"/>
<rect x="14" y="14" width="1232" height="46" fill="#1d2230"/>
<text x="28.0" y="44.0" font-size="13" fill="#9fb3d1" font-weight="700" text-anchor="start">썬더 개틀링 6연장 v3 (4륜 전원 모터 · 무관통 실물 격발 메커니즘) · 도면 07</text>
<text x="651.7" y="44.0" font-size="17" fill="#ffffff" font-weight="700" text-anchor="start">규칙 검사 (1~10장 · 2.5 · 10.6) · 배선</text>
<text x="1232.0" y="76.0" font-size="10.5" fill="#5a6070" font-weight="400" text-anchor="end">4륜 전원 모터 · 고무줄 무관통 · 공중 고정 0 · 3D 충돌 0 · 동축 정렬</text>
<text x="50.0" y="100.0" font-size="12.5" fill="#1d2230" font-weight="700" text-anchor="start">① 조립 규칙 · 충돌 · 경로 자동 검증 결과</text>
<rect x="50" y="114" width="1160" height="26" fill="#eef2f7"/>
<text x="60.0" y="131.0" font-size="10.5" fill="#1f8a50" font-weight="700" text-anchor="start">✔ 1.1 CPU 1대당 1개</text>
<text x="390.0" y="131.0" font-size="10" fill="#1d2230" font-weight="400" text-anchor="start">CPU 보드 1개 (서포트 40 위, M1~M4 4륜 제어)</text>
<text x="60.0" y="157.0" font-size="10.5" fill="#1f8a50" font-weight="700" text-anchor="start">✔ 2.1~2.3 모터 · 확장 보드 수량</text>
<text x="390.0" y="157.0" font-size="10" fill="#1d2230" font-weight="400" text-anchor="start">DC 130 × 4(4/4) + DC 400 × 1(1/2) + 모터 확장 세트 × 1(1/1) = 조작 5개</text>
<rect x="50" y="166" width="1160" height="26" fill="#eef2f7"/>
<text x="60.0" y="183.0" font-size="10.5" fill="#1f8a50" font-weight="700" text-anchor="start">✔ 2.5 모든 바퀴 모터 구동 (헛바퀴 금지)</text>
<text x="390.0" y="183.0" font-size="10" fill="#1d2230" font-weight="400" text-anchor="start">바퀴 4개 = 구동 모터 4개 (100% 직결 · 헛바퀴 0개)</text>
<text x="60.0" y="209.0" font-size="10.5" fill="#1f8a50" font-weight="700" text-anchor="start">✔ 4 구멍 격자 0.0 mm 일치</text>
<text x="390.0" y="209.0" font-size="10" fill="#1d2230" font-weight="400" text-anchor="start">바닥판 · L자 4/14 mm · 배터리 세로 · 확장 보드 · 3-4-5 쐐기 구멍 0.0 mm 일치</text>
<rect x="50" y="218" width="1160" height="26" fill="#eef2f7"/>
<text x="60.0" y="235.0" font-size="10.5" fill="#1f8a50" font-weight="700" text-anchor="start">✔ 10.1~10.2 공중 고정 0 · 동축 정렬</text>
<text x="390.0" y="235.0" font-size="10" fill="#1d2230" font-weight="400" text-anchor="start">구조 112개 실체 체결 · 볼트/너트/캡너트 238개(총구 6 + 걸쇠 6) 동축 통과</text>
<text x="60.0" y="261.0" font-size="10.5" fill="#1f8a50" font-weight="700" text-anchor="start">✔ 10.6 고무줄 무관통 · 메커니즘 확대 상세도</text>
<text x="390.0" y="261.0" font-size="10" fill="#1d2230" font-weight="400" text-anchor="start">장전선(6배럴) 관통 0건 · 전방 비행선(−Z) 장애물 0건 · 도면 06 확대 상세도 &amp; 3D 학습 단계 완비</text>
<rect x="50" y="270" width="1160" height="26" fill="#eef2f7"/>
<text x="60.0" y="287.0" font-size="10.5" fill="#1f8a50" font-weight="700" text-anchor="start">✔ 실체 2-판 AABB &amp; 360° 스윕 충돌 검사</text>
<text x="390.0" y="287.0" font-size="10" fill="#1d2230" font-weight="400" text-anchor="start">구조 부품 쌍 충돌 0건 · 케이지/걸쇠/배럴 360° 스윕 충돌 0건</text>
<text x="60.0" y="313.0" font-size="10.5" fill="#1f8a50" font-weight="700" text-anchor="start">✔ 고각 서보 토크 여유</text>
<text x="390.0" y="313.0" font-size="10" fill="#1d2230" font-weight="400" text-anchor="start">필요 0.28 kg·cm / 서보 4 kg·cm (7%)</text>
<text x="50.0" y="344.0" font-size="12.5" fill="#1d2230" font-weight="700" text-anchor="start">② 배선 (4WD M1~M4 + 확장 보드 EX-M1)</text>
<rect x="50" y="358" width="1160" height="22" fill="#1d2230"/>
<text x="60.0" y="373.0" font-size="10" fill="#fff" font-weight="700" text-anchor="start">포트</text>
<text x="160.0" y="373.0" font-size="10" fill="#fff" font-weight="700" text-anchor="start">부품</text>
<text x="520.0" y="373.0" font-size="10" fill="#fff" font-weight="700" text-anchor="start">역할</text>
<rect x="50" y="380" width="1160" height="23" fill="#eef2f7"/>
<rect x="58" y="383" width="56" height="16" rx="3" fill="#f2c21b"/>
<text x="86.0" y="395.0" font-size="9.2" fill="#1d2230" font-weight="700" text-anchor="middle">M1</text>
<text x="160.0" y="395.0" font-size="10.2" fill="#1d2230" font-weight="700" text-anchor="start">앞 왼쪽 구동 모터 (DC 130)</text>
<text x="520.0" y="395.0" font-size="9.8" fill="#1d2230" font-weight="400" text-anchor="start">조작 · 전륜 좌 (규칙 2.5)</text>
<rect x="58" y="406" width="56" height="16" rx="3" fill="#f2c21b"/>
<text x="86.0" y="418.0" font-size="9.2" fill="#1d2230" font-weight="700" text-anchor="middle">M2</text>
<text x="160.0" y="418.0" font-size="10.2" fill="#1d2230" font-weight="700" text-anchor="start">앞 오른쪽 구동 모터 (DC 130)</text>
<text x="520.0" y="418.0" font-size="9.8" fill="#1d2230" font-weight="400" text-anchor="start">조작 · 전륜 우 (규칙 2.5)</text>
<rect x="50" y="426" width="1160" height="23" fill="#eef2f7"/>
<rect x="58" y="429" width="56" height="16" rx="3" fill="#f2c21b"/>
<text x="86.0" y="441.0" font-size="9.2" fill="#1d2230" font-weight="700" text-anchor="middle">M3</text>
<text x="160.0" y="441.0" font-size="10.2" fill="#1d2230" font-weight="700" text-anchor="start">뒤 왼쪽 구동 모터 (DC 130)</text>
<text x="520.0" y="441.0" font-size="9.8" fill="#1d2230" font-weight="400" text-anchor="start">조작 · 후륜 좌 (규칙 2.5)</text>
<rect x="58" y="452" width="56" height="16" rx="3" fill="#f2c21b"/>
<text x="86.0" y="464.0" font-size="9.2" fill="#1d2230" font-weight="700" text-anchor="middle">M4</text>
<text x="160.0" y="464.0" font-size="10.2" fill="#1d2230" font-weight="700" text-anchor="start">뒤 오른쪽 구동 모터 (DC 130)</text>
<text x="520.0" y="464.0" font-size="9.8" fill="#1d2230" font-weight="400" text-anchor="start">조작 · 후륜 우 (규칙 2.5)</text>
<rect x="50" y="472" width="1160" height="23" fill="#eef2f7"/>
<rect x="58" y="475" width="56" height="16" rx="3" fill="#f2c21b"/>
<text x="86.0" y="487.0" font-size="9.2" fill="#1d2230" font-weight="700" text-anchor="middle">EX-M1</text>
<text x="160.0" y="487.0" font-size="10.2" fill="#1d2230" font-weight="700" text-anchor="start">배럴 모터 (DC 400 · 확장 보드)</text>
<text x="520.0" y="487.0" font-size="9.8" fill="#1d2230" font-weight="400" text-anchor="start">모터 드라이브 확장 세트(A3) 연결 · 1발/6발 연사</text>
<rect x="58" y="498" width="56" height="16" rx="3" fill="#f2c21b"/>
<text x="86.0" y="510.0" font-size="9.2" fill="#1d2230" font-weight="700" text-anchor="middle">IN1</text>
<text x="160.0" y="510.0" font-size="10.2" fill="#1d2230" font-weight="700" text-anchor="start">발사 버튼 (접촉 센서)</text>
<text x="520.0" y="510.0" font-size="9.8" fill="#1d2230" font-weight="400" text-anchor="start">누르면 1발 수동 격발</text>
<rect x="50" y="518" width="1160" height="23" fill="#eef2f7"/>
<rect x="58" y="521" width="56" height="16" rx="3" fill="#f2c21b"/>
<text x="86.0" y="533.0" font-size="9.2" fill="#1d2230" font-weight="700" text-anchor="middle">OUT1</text>
<text x="160.0" y="533.0" font-size="10.2" fill="#1d2230" font-weight="700" text-anchor="start">고각 서보</text>
<text x="520.0" y="533.0" font-size="9.8" fill="#1d2230" font-weight="400" text-anchor="start">0° ~ +9.2° (소5 4절 링크 · 오차 0.0 mm)</text>
<rect x="58" y="544" width="56" height="16" rx="3" fill="#f2c21b"/>
<text x="86.0" y="556.0" font-size="9.2" fill="#1d2230" font-weight="700" text-anchor="middle">OUT2</text>
<text x="160.0" y="556.0" font-size="10.2" fill="#1d2230" font-weight="700" text-anchor="start">발사 LED 빨강</text>
<text x="520.0" y="556.0" font-size="9.8" fill="#1d2230" font-weight="400" text-anchor="start">배럴 회전 중 점등</text>
<rect x="50" y="564" width="1160" height="23" fill="#eef2f7"/>
<rect x="58" y="567" width="56" height="16" rx="3" fill="#f2c21b"/>
<text x="86.0" y="579.0" font-size="9.2" fill="#1d2230" font-weight="700" text-anchor="middle">OUT3</text>
<text x="160.0" y="579.0" font-size="10.2" fill="#1d2230" font-weight="700" text-anchor="start">부저</text>
<text x="520.0" y="579.0" font-size="9.8" fill="#1d2230" font-weight="400" text-anchor="start">발사 전 경고음</text>
<rect x="58" y="590" width="56" height="16" rx="3" fill="#f2c21b"/>
<text x="86.0" y="602.0" font-size="9.2" fill="#1d2230" font-weight="700" text-anchor="middle">UART</text>
<text x="160.0" y="602.0" font-size="10.2" fill="#1d2230" font-weight="700" text-anchor="start">블루투스 모듈</text>
<text x="520.0" y="602.0" font-size="9.8" fill="#1d2230" font-weight="400" text-anchor="start">스마트폰 4WD 주행 · 고각 · 발사</text>
<rect x="50" y="610" width="1160" height="23" fill="#eef2f7"/>
<rect x="58" y="613" width="56" height="16" rx="3" fill="#f2c21b"/>
<text x="86.0" y="625.0" font-size="9.2" fill="#1d2230" font-weight="700" text-anchor="middle">BATT</text>
<text x="160.0" y="625.0" font-size="10.2" fill="#1d2230" font-weight="700" text-anchor="start">배터리케이스 4AA 6V</text>
<text x="520.0" y="625.0" font-size="9.8" fill="#1d2230" font-weight="400" text-anchor="start">CPU 6V 전원</text>
<text x="50.0" y="655.0" font-size="12.5" fill="#1d2230" font-weight="700" text-anchor="start">③ 동작</text>
<text x="60.0" y="673.0" font-size="9.8" fill="#1d2230" font-weight="400" text-anchor="start">• 조종 (블루투스): 4륜 전원 구동 전진 · 후진 · 제자리 회전 (M1~M4) / 고각 0°~+9.2° (OUT1) / 발사 1발 · 6발 연사 (EX-M1)</text>
<text x="60.0" y="689.0" font-size="9.8" fill="#1d2230" font-weight="400" text-anchor="start">• 발사 메커니즘: DC 400rpm 회전 → 12시 36.9° 쐐기가 걸쇠 캡너트(+Z 돔)에서 고무줄 이탈 → 총구 캡너트(−Z 돔) 앞 개방 허공으로 무관통 발사</text>
<text x="60.0" y="705.0" font-size="9.8" fill="#1d2230" font-weight="400" text-anchor="start">• 발사 버튼 (IN1): 차체 뒤 끝 접촉 센서로 수동 1발 시험</text>
<text x="60.0" y="721.0" font-size="9.8" fill="#1d2230" font-weight="400" text-anchor="start">• 안전: 고무줄을 걸 때는 전원을 끄고 총구 캡너트 ↔ 후방 걸쇠 캡너트에 마주 보는 순서로 장착.</text></svg>