<text x="434.9" y="867.0" font-size="9.5" fill="#3a4050" font-weight="400" text-anchor="start">• 아래층 판: 아래층 판을 다리 위에 얹어 (±15, 15)에서 M3 × 6. 모서리에 서포트 35 네 개 (너트).</text>

<text x="434.9" y="918.0" font-size="9.5" fill="#3a4050" font-weight="400" text-anchor="start">• 위층 판 · 옆구리 깃: 위층 판을 서포트 35 위에 M3 × 6. 판 아래 옆 끝에 L자 2×2 네 개, 소7 PCB 깃을 위 · 아래 2줄로.</text>
<text x="434.9" y="935.0" font-size="9.5" fill="#3a4050" font-weight="400" text-anchor="start">• CPU · 목 서보 · 가슴 깃: 서포트 10 위에 CPU 보드 (6V). 목 서보를 앞쪽에 눕혀 귀 4곳 M3 × 10. 판 앞 끝 아래에 소5 PCB 3개를 볼트</text>
<text x="446.9" y="948.0" font-size="9.5" fill="#3a4050" font-weight="400" text-anchor="start">2개씩.</text>
<text x="434.9" y="965.0" font-size="9.5" fill="#3a4050" font-weight="400" text-anchor="start">• 이 도면의 볼트 · 너트: 볼트 3×6 × 50, M3 너트 × 56, 볼트 M3×10 × 8</text></svg></section>

<text x="314.4" y="685.8" font-size="9.5" fill="#3a4050" font-weight="400" text-anchor="start">• 눈 · 눈썹: LED 주황을 머리판 바깥 앞쪽에 볼트 2개씩. 그 위에 L자 2×1 (눈썹)을 1개씩.</text>
<text x="314.4" y="702.8" font-size="9.5" fill="#3a4050" font-weight="400" text-anchor="start">• 부리: 머리 바닥 앞 끝 L자 2×2 세운 다리에 배틀무기 T와 노란 휠가이드 Ø40을 겹쳐 M3 × 10 2개.</text>

<text x="853.1" y="682.8" font-size="9.5" fill="#3a4050" font-weight="400" text-anchor="start">• 날개 서보 (×2): 모터프레임 3×3 두 개로 서보를 위층 판 옆 끝에 세운다 (축 앞). 서보 귀 M3 ×</text>
<text x="865.1" y="695.8" font-size="9.5" fill="#3a4050" font-weight="400" text-anchor="start">10 · 판 M3 × 6.</text>
<text x="853.1" y="712.8" font-size="9.5" fill="#3a4050" font-weight="400" text-anchor="start">• 팔뼈 · 손뼈 (×2): 휠가이드를 서보 축에 (2.6 × 10, 구멍 수평). 팔뼈 1 · 3번 칸 구멍을</text>
<text x="865.1" y="725.8" font-size="9.5" fill="#3a4050" font-weight="400" text-anchor="start">휠가이드에 M3 × 10. 손뼈를 팔뼈 앞에 2칸 겹쳐 4곳 M3 × 6.</text>
<text x="853.1" y="742.8" font-size="9.5" fill="#3a4050" font-weight="400" text-anchor="start">• 깃 (×2, 한쪽 14개): 뼈 아래 끝 뒷면 x = 82 · 92 · 102 · 132 … 232에 L자</text>
<text x="865.1" y="755.8" font-size="9.5" fill="#3a4050" font-weight="400" text-anchor="start">2×2, 깃 PCB를 볼트 2개로. 안쪽 짧게(소7) → 바깥 길게(소8 → 소12).</text>
<text x="853.1" y="772.8" font-size="9.5" fill="#3a4050" font-weight="400" text-anchor="start">• 날개 끝 처진 깃 (×2, 한쪽 3개): x = 242 · 252 · 262에 120도 L자(탭) — 너트 없이</text>
<text x="865.1" y="785.8" font-size="9.5" fill="#3a4050" font-weight="400" text-anchor="start">볼트만. 소8 PCB가 뒤 · 아래 30°로 처진다.</text>
<text x="853.1" y="802.8" font-size="9.5" fill="#3a4050" font-weight="400" text-anchor="start">• 날개덮깃 (×2, 한쪽 1장): 팔뼈 위 끝 뒷면 (x 86 · 116)에 L자 2×2 두 개, 투명 PC</text>
<text x="865.1" y="815.8" font-size="9.5" fill="#3a4050" font-weight="400" text-anchor="start">프레임 앞 가장자리 구멍에 볼트 1개씩. 무게 때문에 한 장만.</text>
<text x="853.1" y="832.8" font-size="9.5" fill="#3a4050" font-weight="400" text-anchor="start">• 이 도면의 볼트 · 너트: 볼트 M3×10 × 12, 볼트 3×6 × 164, M3 너트 × 152, 볼트</text>
<text x="865.1" y="845.8" font-size="9.5" fill="#3a4050" font-weight="400" text-anchor="start">2.6×10 와셔붙이 × 2</text></svg></section>
