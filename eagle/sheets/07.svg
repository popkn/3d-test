<text x="70.0" y="773.0" font-size="10.5" fill="#e8432a" font-weight="700" text-anchor="start">블루투스</text>
<text x="260.0" y="773.0" font-size="10.5" fill="#1d2230" font-weight="400" text-anchor="start">스마트폰 버튼으로 날개 · 머리 · 눈을 직접 조종 (자동 동작보다 우선)</text></svg>