<!doctype html>
<html lang="ko">

  <meta charset="UTF-8" />

  <style>
/* 로보로보 부품 뷰어 */
:root {
  --bg: #efede9; --ink: #1d1d1f; --soft: #8a8884; --line: rgba(0, 0, 0, 0.08);
  --accent: #e8432a; --ok: #2fae67; --panel: #f8f7f4;
  font-family: "JetBrains Mono", ui-monospace, Menlo, monospace;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
body {
  display: grid; grid-template-columns: 240px 1fr 330px; height: 100vh; overflow: hidden;
  background: var(--bg); color: var(--ink); font-size: 11px; letter-spacing: 0.03em;
}
.bar { display: inline-block; width: 2px; height: 11px; background: var(--accent); margin-right: 7px; vertical-align: -1px; }

/* 목록 */
.list { border-right: 1px solid var(--line); background: var(--panel); overflow-y: auto; }
.list header { padding: 16px; font-weight: 700; font-size: 12px; position: sticky; top: 0; background: var(--panel); }
.list h3 { padding: 10px 16px 6px; color: var(--soft); font-size: 9px; font-weight: 600; }
.list a { display: block; padding: 9px 16px; color: inherit; text-decoration: none; border-left: 2px solid transparent; }
.list a:hover { background: rgba(0, 0, 0, 0.03); }
.list a.on { border-left-color: var(--accent); background: #fff; }
.list a b { display: block; font-weight: 600; }
.list a small { color: var(--soft); font-size: 9px; }

/* 3D 화면 */
.stage { position: relative; min-width: 0; overflow: hidden; }
.stage canvas { display: block; }
.toggles { position: absolute; top: 14px; right: 14px; display: flex; gap: 6px; z-index: 2; }
.toggles button, .ctl button {
  font: inherit; font-size: 10px; font-weight: 600; padding: 6px 10px; border: 1px solid rgba(0, 0, 0, 0.14);
  border-radius: 3px; background: #fff; color: var(--ink); cursor: pointer;
}
.toggles button.on { background: var(--accent); border-color: var(--accent); color: #fff; }
.loading { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); color: var(--soft); display: none; }
.hint { position: absolute; bottom: 10px; left: 50%; transform: translateX(-50%); color: var(--soft); font-size: 9px; }
.overlay { position: absolute; inset: 0; pointer-events: none; }
.overlay svg { position: absolute; inset: 0; width: 100%; height: 100%; }
.overlay polyline { fill: none; stroke: var(--accent); stroke-width: 1; transition: opacity 0.3s; }
.tag {
  position: absolute; left: 0; top: 0; font-size: 10px; font-weight: 700; white-space: nowrap; transition: opacity 0.3s;
  text-shadow: 0 0 3px var(--bg), 0 0 3px var(--bg), 0 0 6px var(--bg);
}
.tag::before { content: ''; display: inline-block; width: 6px; height: 6px; background: var(--accent); margin-right: 5px; }
.tag small { display: block; padding-left: 11px; color: var(--soft); font-weight: 400; font-size: 9px; }
.tag.left { text-align: right; }
.dim { position: absolute; left: 0; top: 0; font-size: 10px; font-weight: 700; color: var(--accent); white-space: nowrap;
  text-shadow: 0 0 3px var(--bg), 0 0 3px var(--bg); transition: opacity 0.3s; }

/* 오른쪽 패널 */
.panel { border-left: 1px solid var(--line); background: var(--panel); overflow-y: auto; padding: 18px 18px 30px; }
.p-name { font-size: 16px; margin-bottom: 4px; }
.p-size { font-weight: 700; display: flex; align-items: center; gap: 8px; }
.badge { font-size: 8px; padding: 2px 6px; border-radius: 2px; color: #fff; }
.badge.ok { background: var(--ok); }
.badge.est { background: var(--soft); }
.p-note { color: var(--soft); font-size: 9px; margin: 4px 0 14px; }
.panel section { border-top: 1px solid var(--line); padding: 12px 0; }
.panel h2 { font-size: 10px; font-weight: 700; margin-bottom: 8px; }
.p-func { color: #4a4946; line-height: 1.5; margin-bottom: 10px; font-size: 10px; }
.p-controls { display: grid; gap: 8px; margin-bottom: 12px; }
.p-controls:has(.compact) { grid-template-columns: 1fr 1fr; }
.p-controls .ctl:not(.compact) { grid-column: 1 / -1; }
.ctl { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.ctl > span { flex: 1; }
.ctl input[type="range"] { width: 110px; accent-color: var(--accent); }
.ctl b { width: 50px; text-align: right; font-weight: 600; }
.ctl select { font: inherit; font-size: 10px; padding: 4px; border: 1px solid rgba(0, 0, 0, 0.14); border-radius: 3px; background: #fff; max-width: 190px; }
.ctl-toggle input { display: none; }
.ctl-toggle i { width: 30px; height: 16px; border-radius: 8px; background: #d6d3cd; position: relative; transition: background 0.2s; cursor: pointer; flex: none; }
.ctl-toggle i::after { content: ''; position: absolute; top: 2px; left: 2px; width: 12px; height: 12px; border-radius: 50%; background: #fff; transition: left 0.2s; }
.ctl-toggle input:checked + i { background: var(--accent); }
.ctl-toggle input:checked + i::after { left: 16px; }
.ctl-toggle { cursor: pointer; }
.ctl.compact span { font-size: 9px; }
.ctl-button button { width: 100%; padding: 8px; background: var(--ink); color: #fff; border-color: var(--ink); }
.ctl-button button:active { background: var(--accent); border-color: var(--accent); }
.p-readouts, .p-specs { display: grid; grid-template-columns: auto 1fr; gap: 5px 12px; }
.p-readouts { background: #fff; border: 1px solid var(--line); border-radius: 4px; padding: 10px; }
.p-readouts dt, .p-specs dt { color: var(--soft); font-size: 9px; padding-top: 1px; }
.p-readouts dd { font-weight: 700; color: var(--accent); }
.p-specs dd { font-weight: 600; }
.p-log { margin-top: 8px; font-size: 9px; color: var(--soft); display: grid; gap: 2px; }
.p-log div:first-child { color: var(--ink); }
.p-ports { list-style: none; display: grid; gap: 6px; }
.p-ports li { display: grid; gap: 1px; }
.p-ports span { color: var(--soft); font-size: 9px; }
.p-link { display: inline-block; margin-top: 8px; color: var(--accent); font-weight: 700; text-decoration: none; }

/* 좁은 화면: 목록은 위 가로줄, 패널은 아래 */
@media (max-width: 900px) {
  body { grid-template-columns: 1fr; grid-template-rows: auto 55vh auto; height: auto; overflow: auto; }
  .list { border-right: 0; border-bottom: 1px solid var(--line); }
  .list header { display: none; }
  .list nav { display: flex; overflow-x: auto; }
  .list h3 { display: none; }
  .list a { flex: none; border-left: 0; border-bottom: 2px solid transparent; }
  .list a.on { border-bottom-color: var(--accent); }
  .stage { height: 55vh; }
  .panel { border-left: 0; }
  .toggles { top: 10px; right: 10px; }
  .toggles button { padding: 5px 8px; font-size: 9px; }
}

/* 부품 하나만: 목록 없이 */
body { grid-template-columns: 1fr 330px; }
@media (max-width: 900px) { body { grid-template-columns: 1fr; grid-template-rows: 60vh auto; } }
</style>

  ],

    { id: "mount", type: "\uACE0\uC815 \uADC0 \uAD6C\uBA4D 4\uAC1C", role: "\uD504\uB808\uC784\uC5D0 \uB098\uC0AC \uACE0\uC815" }
  ]

// src/catalog/parts/dc-motor-130-rs/model.js
import * as THREE5 from "three";

// src/kit/motorCase.js
import * as THREE4 from "three";
import { RoundedBoxGeometry as RoundedBoxGeometry2 } from "three/addons/geometries/RoundedBoxGeometry.js";

// src/kit/materials.js
import * as THREE from "three";
var M = {
  pcbBlack: new THREE.MeshStandardMaterial({ color: 1579291, roughness: 0.5 }),
  pcbWhite: new THREE.MeshStandardMaterial({ color: 16053230, roughness: 0.55 }),
  pcbEdgeDark: new THREE.MeshStandardMaterial({ color: 2894372, roughness: 0.8 }),
  pcbEdgeLight: new THREE.MeshStandardMaterial({ color: 15328468, roughness: 0.8 }),
  metal: new THREE.MeshStandardMaterial({ color: 14080219, metalness: 1, roughness: 0.28 }),
  metalDark: new THREE.MeshStandardMaterial({ color: 5593182, metalness: 0.9, roughness: 0.4 }),
  brass: new THREE.MeshStandardMaterial({ color: 13215834, metalness: 1, roughness: 0.32 }),
  gold: new THREE.MeshStandardMaterial({ color: 14201434, metalness: 1, roughness: 0.3 }),
  copper: new THREE.MeshStandardMaterial({ color: 13140047, metalness: 1, roughness: 0.35 }),
  solder: new THREE.MeshStandardMaterial({ color: 14277598, metalness: 1, roughness: 0.25 }),
  blackPlastic: new THREE.MeshStandardMaterial({ color: 1513498, roughness: 0.55 }),
  matteBlack: new THREE.MeshStandardMaterial({ color: 2303015, roughness: 0.75 }),
  hole: new THREE.MeshStandardMaterial({ color: 394759, roughness: 0.9 }),
  whitePlastic: new THREE.MeshStandardMaterial({ color: 15855592, roughness: 0.6 }),
  ivoryPlastic: new THREE.MeshStandardMaterial({ color: 15919832, roughness: 0.55 }),
  redPlastic: new THREE.MeshStandardMaterial({ color: 14168362, roughness: 0.45 }),
  bluePlastic: new THREE.MeshStandardMaterial({ color: 2846678, roughness: 0.4 }),
  chip: new THREE.MeshStandardMaterial({ color: 1776670, roughness: 0.45 }),
  ceramic: new THREE.MeshStandardMaterial({ color: 12032622, roughness: 0.6 }),
  resistorBody: new THREE.MeshStandardMaterial({ color: 14271642, roughness: 0.5 }),
  capBlue: new THREE.MeshStandardMaterial({ color: 2042436, roughness: 0.4, metalness: 0.2 }),
  acrylic: new THREE.MeshPhysicalMaterial({
    color: 16777215,
    roughness: 0.05,
    transmission: 0,
    transparent: true,
    opacity: 0.22,
    clearcoat: 1,
    depthWrite: false,
    side: THREE.DoubleSide
  }),
  diffuser: new THREE.MeshStandardMaterial({ color: 15987954, roughness: 0.35, transparent: true, opacity: 0.94 }),
  wireRed: new THREE.MeshStandardMaterial({ color: 13116189, roughness: 0.5 }),
  wireBlack: new THREE.MeshStandardMaterial({ color: 1710618, roughness: 0.5 }),
  rubberTire: new THREE.MeshStandardMaterial({ color: 15231516, roughness: 0.7 })
};
function mesh(geo, mat, { cast = true, receive = true } = {}) {
  const m = new THREE.Mesh(geo, mat);
  m.castShadow = cast;
  m.receiveShadow = receive;
  return m;
}

// src/kit/components.js
import * as THREE3 from "three";
import { RoundedBoxGeometry } from "three/addons/geometries/RoundedBoxGeometry.js";

// src/kit/textures.js
import * as THREE2 from "three";
function canvasTexture(wmm, hmm, draw, pxPerMm = 24) {
  const c2 = document.createElement("canvas");
  c2.width = Math.max(2, Math.round(wmm * pxPerMm));
  c2.height = Math.max(2, Math.round(hmm * pxPerMm));
  const g = c2.getContext("2d");
  g.scale(pxPerMm, pxPerMm);
  draw(g, wmm, hmm);
  const t = new THREE2.CanvasTexture(c2);
  t.colorSpace = THREE2.SRGBColorSpace;
  t.anisotropy = 8;
  t.userData = { canvas: c2, ctx: g, pxPerMm, wmm, hmm, draw };
  return t;
}
var FONT = '"JetBrains Mono", ui-monospace, Menlo, monospace';

// src/kit/components.js
var box = (w, h, d, mat, x = 0, y = 0, z = 0, opt) => {
  const m = mesh(new THREE3.BoxGeometry(w, h, d), mat, opt);
  m.position.set(x, y + h / 2, z);
  return m;
};

// src/kit/motorCase.js
var MOTOR = { bodyLength: 40, bodyHeight: 33, width: 20, earSpan: 60, earThickness: 2.4 };
function makeMotorCase({ shaft = "top", hubColor = M.bluePlastic, sticker = null, topLabel = "ROBOROBO", bodyHeight = MOTOR.bodyHeight } = {}) {
  const { bodyLength: L, width: W, earSpan, earThickness } = MOTOR;
  const H = bodyHeight;
  const g = new THREE4.Group();
  const body = mesh(new RoundedBoxGeometry2(L, H, W, 3, 1.2), M.blackPlastic);
  body.position.y = H / 2;
  g.add(body);
  g.add(box(L + 0.1, 0.4, W + 0.1, M.matteBlack, 0, H - 7, 0, { cast: false }));
  g.add(box(L + 0.1, 0.4, W + 0.1, M.matteBlack, 0, 5, 0, { cast: false }));
  const earLen = (earSpan - L) / 2;
  for (const s of [-1, 1]) {
    const ear = new THREE4.Shape();
    ear.moveTo(0, -W / 2);
    ear.lineTo(earLen - 1.5, -W / 2);
    ear.quadraticCurveTo(earLen, -W / 2, earLen, -W / 2 + 1.5);
    ear.lineTo(earLen, W / 2 - 1.5);
    ear.quadraticCurveTo(earLen, W / 2, earLen - 1.5, W / 2);
    ear.lineTo(0, W / 2);
    for (const z of [-5, 5]) {
      const p = new THREE4.Path();
      p.absarc(earLen * 0.55, z, 1.6, 0, Math.PI * 2, true);
      ear.holes.push(p);
    }
    const geo = new THREE4.ExtrudeGeometry(ear, { depth: earThickness, bevelEnabled: false });
    geo.rotateX(Math.PI / 2);
    const m = mesh(geo, M.blackPlastic);
    m.scale.x = s;
    m.position.set(s * L / 2, H - 9, 0);
    g.add(m);
  }
  const topMat = new THREE4.MeshStandardMaterial({
    roughness: 0.55,
    map: canvasTexture(L - 4, W - 4, (c2, w, h) => {
      c2.fillStyle = "#17181a";
      c2.fillRect(0, 0, w, h);
      c2.fillStyle = "#2c2d30";
      c2.font = `italic 700 3.2px ${FONT}`;
      c2.fillText(topLabel, 2, h / 2 + 1);
    }, 24)
  });
  const top = mesh(new THREE4.PlaneGeometry(L - 4, W - 4), topMat, { cast: false });
  top.rotation.x = -Math.PI / 2;
  top.position.y = H + 0.02;
  g.add(top);
  g.add(box(1.6, 0.2, 6, M.whitePlastic, L / 2 - 8, H, 0, { cast: false }));
  const hubs = [];
  function makeHub() {
    const hub = new THREE4.Group();
    const collar = mesh(new THREE4.CylinderGeometry(5, 5, 1.2, 32), M.matteBlack);
    collar.position.y = 0.6;
    const cyl = mesh(new THREE4.CylinderGeometry(3.6, 3.6, 4, 6), hubColor);
    cyl.position.y = 1.2 + 2;
    const holeM = mesh(new THREE4.CylinderGeometry(1.2, 1.2, 0.1, 16), M.hole, { cast: false });
    holeM.position.y = 5.25;
    const mark = box(0.6, 0.12, 3, M.whitePlastic, 0, 5.2, 1.8, { cast: false });
    const spin = new THREE4.Group();
    spin.add(cyl, holeM, mark);
    hub.add(collar, spin);
    hub.userData.spin = spin;
    return hub;
  }
  const shaftX = -L / 2 + 10;
  const boss = mesh(new THREE4.CylinderGeometry(6, 6, 2, 32), M.blackPlastic);
  boss.position.set(shaftX, H + 1, 0);
  g.add(boss);
  const topHub = makeHub();
  topHub.position.set(shaftX, H + 2, 0);
  g.add(topHub);
  hubs.push({ hub: topHub, axis: new THREE4.Vector3(0, 1, 0) });
  if (shaft === "dual") {
    const bottomHub = makeHub();
    bottomHub.rotation.x = Math.PI;
    bottomHub.position.set(shaftX, 0, 0);
    g.add(bottomHub);
    hubs.push({ hub: bottomHub, axis: new THREE4.Vector3(0, -1, 0) });
  }
  if (sticker) {
    const st = mesh(new THREE4.PlaneGeometry(9, 9), new THREE4.MeshStandardMaterial({
      roughness: 0.4,
      map: canvasTexture(9, 9, (c2, w, h) => {
        c2.fillStyle = sticker.color;
        c2.fillRect(0, 0, w, h);
        c2.fillStyle = "#ffffff";
        c2.font = `900 5.5px ${FONT}`;
        c2.fillText(sticker.text, 1.6, 6.8);
        c2.font = `600 1px ${FONT}`;
        c2.fillText(sticker.sub || "", 0.6, 8.4);
      }, 32)
    }), { cast: false });
    st.rotation.x = -Math.PI / 2;
    st.position.set(2, H + 0.05, 0);
    g.add(st);
  }
  const start = new THREE4.Vector3(L / 2 - 4, H - 3, -W / 2 + 4);
  const pts = [
    start,
    new THREE4.Vector3(L / 2 + 6, H + 6, -W / 2 - 4),
    new THREE4.Vector3(L / 2 + 22, H - 2, -6),
    new THREE4.Vector3(L / 2 + 30, H - 12, 4),
    new THREE4.Vector3(L / 2 + 38, H - 16, 10)
  ];
  const curve = new THREE4.CatmullRomCurve3(pts);
  for (const [off, mat] of [[-0.65, M.wireRed], [0.65, M.wireBlack]]) {
    const shifted = new THREE4.CatmullRomCurve3(curve.points.map((p) => p.clone().add(new THREE4.Vector3(0, 0, off))));
    g.add(mesh(new THREE4.TubeGeometry(shifted, 40, 0.65, 8, false), mat));
  }
  const end = pts[pts.length - 1];
  const plug = box(5.2, 2.6, 5.2, M.blackPlastic, end.x + 2.4, end.y - 1.3, end.z);
  g.add(plug);
  g.userData = { hubs };
  return g;
}
function attachWheel(motor, { dia = 52, width = 18 } = {}) {
  const { hub, axis } = motor.userData.hubs[0];
  const wheel = new THREE4.Group();
  const spin = new THREE4.Group();
  wheel.add(spin);
  const tire = mesh(new THREE4.TorusGeometry(dia / 2 - 5, 5, 16, 48), M.rubberTire);
  tire.rotation.x = Math.PI / 2;
  tire.scale.z = width / 10;
  const rim = mesh(new THREE4.CylinderGeometry(dia / 2 - 7, dia / 2 - 7, width * 0.8, 40), new THREE4.MeshStandardMaterial({ color: 10133672, roughness: 0.5, metalness: 0.4 }));
  spin.add(tire, rim);
  for (let i = 0; i < 5; i++) {
    const hole = mesh(new THREE4.CylinderGeometry(3.4, 3.4, width * 0.82, 16), M.matteBlack, { cast: false });
    const a = i / 5 * Math.PI * 2;
    hole.position.set(Math.cos(a) * 11, 0, Math.sin(a) * 11);
    spin.add(hole);
  }
  wheel.position.copy(hub.position).addScaledVector(axis, 5 + width * 0.45);
  wheel.quaternion.setFromUnitVectors(new THREE4.Vector3(0, 1, 0), axis);
  wheel.visible = false;
  wheel.userData.noBounds = true;
  wheel.userData.spin = spin;
  motor.add(wheel);
  return wheel;
}

// src/catalog/parts/dc-motor-130-rs/model.js
function build() {
  const root = new THREE5.Group();
  const motor = makeMotorCase({ shaft: "top", hubColor: M.bluePlastic, sticker: null });
  root.add(motor);
  const wheel = attachWheel(motor);
  const hubs = motor.userData.hubs;
  return {
    object3d: root,
    labels: [
      { name: "OUTPUT SHAFT", sub: "130 rpm \xB7 6V", object: hubs[0].hub, anchor: [0, 5, 0], off: [70, -60] },
      { name: "MOUNT EARS", sub: "\uACE0\uC815 \uAD6C\uBA4D 4\uAC1C", object: motor, anchor: [-27, 24, 0], off: [-120, -50] },
      { name: "POWER LEAD", sub: "\uBE68\uAC15(+) \xB7 \uAC80\uC815(-)", object: motor, anchor: [42, 19, 10], off: [40, 60] }
    ],
    handles: { hubs, wheel }
  };
}

// src/kit/motorSim.js
function createMotorFunction(model2, ui, { ratedVoltage, ratedRpm, maxVoltage, noLoadCurrent = null, torque = null }) {
  const state = { volt: ratedVoltage, dir: 1, run: false, wheel: false, angle: 0 };
  const hubs = model2.handles.hubs;
  const wheel = model2.handles.wheel;
  ui.controls([
    { type: "toggle", id: "run", label: "\uC804\uC6D0", value: false },
    { type: "slider", id: "volt", label: "\uC804\uC555", min: 0, max: maxVoltage, step: 0.1, value: ratedVoltage, unit: "V" },
    { type: "select", id: "dir", label: "\uBC29\uD5A5", options: [["1", "\uC815\uD68C\uC804 (CW)"], ["-1", "\uC5ED\uD68C\uC804 (CCW)"]], value: "1" },
    { type: "toggle", id: "wheel", label: "\uBC14\uD034 \uB2EC\uAE30", value: false }
  ]);
  ui.readouts([
    ["rpm", "\uD68C\uC804 \uC18D\uB3C4"],
    ["rps", "\uCD08\uB2F9 \uD68C\uC804"],
    ["current", "\uBB34\uBD80\uD558 \uC804\uB958"],
    ["note", "\uC124\uBA85"]
  ]);
  return {
    onControl(id, v) {
      if (id === "run") state.run = v;
      if (id === "volt") state.volt = v;
      if (id === "dir") state.dir = Number(v);
      if (id === "wheel") {
        state.wheel = v;
        if (wheel) wheel.visible = v;
      }
    },
    update(dt) {
      const rpm = state.run ? ratedRpm * (state.volt / ratedVoltage) : 0;
      state.angle += rpm / 60 * Math.PI * 2 * dt * state.dir;
      for (const { hub } of hubs) hub.userData.spin.rotation.y = state.angle;
      if (wheel) wheel.userData.spin.rotation.y = state.angle;
      ui.readout("rpm", `${Math.round(rpm)} rpm`);
      ui.readout("rps", `${(rpm / 60).toFixed(2)} \uD68C/\uCD08`);
      ui.readout("current", noLoadCurrent && state.run ? `${Math.round(noLoadCurrent * (state.volt / ratedVoltage))} mA (\uCD94\uC815)` : "-");
      ui.readout("note", state.volt > ratedVoltage * 1.25 ? "\uC815\uACA9\uBCF4\uB2E4 \uB192\uC740 \uC804\uC555: \uBAA8\uD130\uAC00 \uC190\uC0C1\uB420 \uC218 \uC788\uC74C" : torque ? `\uCD9C\uB825 \uD1A0\uD06C ${torque}` : `\uC815\uACA9 ${ratedVoltage}V\uC5D0\uC11C ${ratedRpm} rpm`);
    }
  };
}

// src/catalog/parts/dc-motor-130-rs/function.js
function create(model2, ui) {
  return createMotorFunction(model2, ui, spec_default.motor);
}

import * as THREE6 from "three";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";
import { RoomEnvironment } from "three/addons/environments/RoomEnvironment.js";
function createScene(container) {
  const renderer = new THREE6.WebGLRenderer({ antialias: true });
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  renderer.outputColorSpace = THREE6.SRGBColorSpace;
  renderer.toneMapping = THREE6.ACESFilmicToneMapping;
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE6.PCFSoftShadowMap;
  container.appendChild(renderer.domElement);
  const scene = new THREE6.Scene();
  scene.background = new THREE6.Color(15724009);
  const pmrem = new THREE6.PMREMGenerator(renderer);
  scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;
  scene.environmentIntensity = 0.6;
  const camera = new THREE6.PerspectiveCamera(35, 1, 1, 5e3);
  const controls = new OrbitControls(camera, renderer.domElement);
  controls.enableDamping = true;
  controls.maxPolarAngle = Math.PI * 0.95;
  controls.autoRotateSpeed = 1.2;
  scene.add(new THREE6.HemisphereLight(16777215, 14210252, 1.1));
  const key = new THREE6.DirectionalLight(16777215, 2.2);
  key.castShadow = true;
  key.shadow.mapSize.set(2048, 2048);
  key.shadow.bias = -4e-4;
  scene.add(key, key.target);
  const fill = new THREE6.DirectionalLight(16774380, 0.5);
  scene.add(fill);
  const ground = new THREE6.Mesh(new THREE6.PlaneGeometry(4e3, 4e3), new THREE6.ShadowMaterial({ opacity: 0.14 }));
  ground.rotation.x = -Math.PI / 2;
  ground.receiveShadow = true;
  scene.add(ground);
  function frame(box3) {
    const size = box3.getSize(new THREE6.Vector3());
    const center = box3.getCenter(new THREE6.Vector3());
    const r = size.length() / 2;
    const dist = r / Math.sin(THREE6.MathUtils.degToRad(camera.fov / 2)) * 1.5;
    const dir = new THREE6.Vector3(-0.75, 0.8, 1).normalize();
    camera.position.copy(center).addScaledVector(dir, dist);
    camera.near = dist / 100;
    camera.far = dist * 20;
    camera.updateProjectionMatrix();
    controls.target.copy(center);
    controls.minDistance = r * 0.8;
    controls.maxDistance = dist * 4;
    const s = r * 2;
    key.position.set(center.x - s * 0.6, s * 1.6, center.z + s * 0.8);
    key.target.position.copy(center);
    Object.assign(key.shadow.camera, { left: -s, right: s, top: s, bottom: -s, near: s * 0.1, far: s * 5 });
    key.shadow.camera.updateProjectionMatrix();
    fill.position.set(center.x + s, s * 0.6, center.z - s);
  }
  function resize() {
    const w = container.clientWidth, h = container.clientHeight;
    renderer.setSize(w, h);
    camera.aspect = w / h;
    camera.updateProjectionMatrix();
  }
  new ResizeObserver(resize).observe(container);
  resize();
  return { renderer, scene, camera, controls, frame };
}
function partBounds(root) {
  root.updateMatrixWorld(true);
  const box3 = new THREE6.Box3();
  const tmp = new THREE6.Box3();
  (function walk(o) {
    if (o.userData.noBounds) return;
    if (o.isMesh && !o.isPoints) {
      if (!o.geometry.boundingBox) o.geometry.computeBoundingBox();
      tmp.copy(o.geometry.boundingBox).applyMatrix4(o.matrixWorld);
      box3.union(tmp);
    }
    for (const c2 of o.children) walk(c2);
  })(root);
  return box3;
}

// src/viewer/overlay.js
import * as THREE7 from "three";
var SVG = "http://www.w3.org/2000/svg";
function createOverlay(container) {
  const layer = document.createElement("div");
  layer.className = "overlay";
  const svg = document.createElementNS(SVG, "svg");
  layer.appendChild(svg);
  container.appendChild(layer);
  const dimGroup = new THREE7.Group();
  const dimMat = new THREE7.LineBasicMaterial({ color: 15221546 });
  let labels = [];
  let dims = [];
  const v = new THREE7.Vector3();
  function clear() {
    for (const l of labels) {
      l.el.remove();
      l.line.remove();
    }
    for (const d of dims) d.el.remove();
    labels = [];
    dims = [];
    dimGroup.clear();
  }
  function setLabels(list) {
    for (const def of list) {
      const el = document.createElement("div");
      el.className = "tag";
      el.innerHTML = `${def.name}<small>${def.sub}</small>`;
      layer.appendChild(el);
      const line = document.createElementNS(SVG, "polyline");
      svg.appendChild(line);
      labels.push({ ...def, anchor: new THREE7.Vector3(...def.anchor), el, line });
    }
  }
  function setDims(box3, size) {
    const { min, max } = box3;
    const pad = Math.max(4, (max.x - min.x) * 0.06);
    const mark = size.estimated ? " (\uCD94\uC815)" : "";
    const list = [
      { a: new THREE7.Vector3(min.x, min.y, max.z + pad), b: new THREE7.Vector3(max.x, min.y, max.z + pad), tick: new THREE7.Vector3(0, 0, 1), text: `${size.x} MM${mark}` },
      { a: new THREE7.Vector3(max.x + pad, min.y, min.z), b: new THREE7.Vector3(max.x + pad, min.y, max.z), tick: new THREE7.Vector3(1, 0, 0), text: `${size.z} MM${mark}` },
      { a: new THREE7.Vector3(max.x + pad * 0.7, min.y, max.z + pad * 0.7), b: new THREE7.Vector3(max.x + pad * 0.7, max.y, max.z + pad * 0.7), tick: new THREE7.Vector3(1, 0, 0), text: `${size.y} MM${mark}` }
    ];
    const pts = [];
    for (const d of list) {
      const t = d.tick.clone().multiplyScalar(pad * 0.25);
      pts.push(d.a, d.b, d.a.clone().add(t), d.a.clone().sub(t), d.b.clone().add(t), d.b.clone().sub(t));
      const el = document.createElement("div");
      el.className = "dim";
      el.textContent = d.text;
      layer.appendChild(el);
      dims.push({ ...d, el, offset: pad * 0.6 });
    }
    dimGroup.add(new THREE7.LineSegments(new THREE7.BufferGeometry().setFromPoints(pts), dimMat));
  }
  function project(p, camera, w, h) {
    v.copy(p).project(camera);
    return [(v.x * 0.5 + 0.5) * w, (-v.y * 0.5 + 0.5) * h, v.z];
  }
  function update(camera, { showLabels, showDims }) {
    const w = container.clientWidth, h = container.clientHeight;
    const s = Math.min(1, w / 1e3);
    for (const l of labels) {
      l.el.style.opacity = showLabels ? 1 : 0;
      l.line.style.opacity = showLabels ? 1 : 0;
      if (!showLabels) continue;
      const world = l.anchor.clone().applyMatrix4(l.object.matrixWorld);
      const [ax, ay, z] = project(world, camera, w, h);
      if (z > 1) {
        l.el.style.opacity = 0;
        l.line.style.opacity = 0;
        continue;
      }
      const left = l.off[0] < 0;
      const lw = l.el.offsetWidth;
      let lx = ax + l.off[0] * s;
      lx = left ? Math.max(lw + 8, Math.min(w - 8, lx)) : Math.max(8, Math.min(w - lw - 8, lx));
      const ly = Math.max(20, Math.min(h - 24, ay + l.off[1] * s));
      l.el.style.transform = `translate(${left ? lx - lw : lx}px, ${ly - 8}px)`;
      l.el.classList.toggle("left", left);
      l.line.setAttribute("points", `${ax},${ay} ${lx + (left ? 4 : -4)},${ly}`);
    }
    dimGroup.visible = showDims;
    for (const d of dims) {
      d.el.style.opacity = showDims ? 1 : 0;
      const mid = d.a.clone().lerp(d.b, 0.5).addScaledVector(d.tick, d.offset);
      const [x, y] = project(mid, camera, w, h);
      d.el.style.transform = `translate(${x - d.el.offsetWidth / 2}px, ${y - 7}px)`;
    }
  }
  return { dimGroup, clear, setLabels, setDims, update };
}

// src/viewer/panel.js
function createPanel(root) {
  let onControl = () => {
  };
  const readoutEls = {};
  function showSpec(spec) {
    root.querySelector(".p-name").textContent = spec.name;
    const badge = root.querySelector(".p-size");
    const s = spec.size;
    badge.innerHTML = `${s.x} \xD7 ${s.z} \xD7 ${s.y} mm <span class="badge ${s.estimated ? "est" : "ok"}">${s.estimated ? "\uCD94\uC815" : "\uACF5\uC2DD"}</span>`;
    root.querySelector(".p-note").textContent = s.note;
    root.querySelector(".p-func").textContent = spec.function;
    root.querySelector(".p-specs").innerHTML = spec.specs.map(([k, v]) => `<dt>${k}</dt><dd>${v}</dd>`).join("");
    root.querySelector(".p-ports").innerHTML = (spec.ports || []).map((p) => `<li><b>${p.type}</b><span>${p.role}</span></li>`).join("");
    const link = root.querySelector(".p-link");
    link.href = spec.url;
  }
  const ui = {
    controls(list) {
      const box3 = root.querySelector(".p-controls");
      box3.innerHTML = "";
      for (const c2 of list) {
        const row = document.createElement("label");
        row.className = `ctl ctl-${c2.type}${c2.compact ? " compact" : ""}`;
        if (c2.type === "toggle") {
          row.innerHTML = `<span>${c2.label}</span><input type="checkbox" ${c2.value ? "checked" : ""}><i></i>`;
          const input = row.querySelector("input");
          input.addEventListener("change", () => onControl(c2.id, input.checked));
        } else if (c2.type === "slider") {
          row.innerHTML = `<span>${c2.label}</span><input type="range" min="${c2.min}" max="${c2.max}" step="${c2.step}" value="${c2.value}"><b>${c2.value}${c2.unit || ""}</b>`;
          const input = row.querySelector("input");
          const out = row.querySelector("b");
          input.addEventListener("input", () => {
            out.textContent = `${input.value}${c2.unit || ""}`;
            onControl(c2.id, Number(input.value));
          });
        } else if (c2.type === "select") {
          row.innerHTML = `<span>${c2.label}</span><select>${c2.options.map(([v, t]) => `<option value="${v}" ${String(c2.value) === v ? "selected" : ""}>${t}</option>`).join("")}</select>`;
          const sel = row.querySelector("select");
          sel.addEventListener("change", () => onControl(c2.id, sel.value));
        } else if (c2.type === "button") {
          row.innerHTML = `<button type="button">${c2.label}</button>`;
          row.querySelector("button").addEventListener("click", () => onControl(c2.id, true));
        }
        box3.appendChild(row);
      }
    },
    readouts(list) {
      const box3 = root.querySelector(".p-readouts");
      box3.innerHTML = list.map(([id, label]) => `<dt>${label}</dt><dd data-id="${id}">-</dd>`).join("");
      for (const k of Object.keys(readoutEls)) delete readoutEls[k];
      for (const [id] of list) readoutEls[id] = box3.querySelector(`[data-id="${id}"]`);
    },
    readout(id, text) {
      const el = readoutEls[id];
      if (el && el.textContent !== text) el.textContent = text;
    },
    log(text) {
      const box3 = root.querySelector(".p-log");
      const line = document.createElement("div");
      line.textContent = text;
      box3.prepend(line);
      while (box3.children.length > 8) box3.lastChild.remove();
    }
  };
  function reset(handler) {
    onControl = handler;
    root.querySelector(".p-controls").innerHTML = "";
    root.querySelector(".p-readouts").innerHTML = "";
    root.querySelector(".p-log").innerHTML = "";
  }
  return { ui, showSpec, reset };
}

// __entry.js
var stage = document.getElementById("stage");
var view = createScene(stage);
var overlay = createOverlay(stage);
view.scene.add(overlay.dimGroup);
var panel = createPanel(document.getElementById("panel"));
var opts = { labels: true, dims: true, spin: false };
document.querySelectorAll(".toggles button").forEach((b) => b.addEventListener("click", () => {
  opts[b.dataset.k] = !opts[b.dataset.k];
  b.classList.toggle("on", opts[b.dataset.k]);
  view.controls.autoRotate = opts.spin;
}));
var model = build();
var holder = new THREE8.Group();
holder.add(model.object3d);
view.scene.add(holder);
var box2 = partBounds(holder);
var c = box2.getCenter(new THREE8.Vector3());
model.object3d.position.set(-c.x, -box2.min.y, -c.z);
var fitted = partBounds(holder);
view.frame(fitted);
overlay.setLabels(model.labels);
overlay.setDims(fitted, spec_default.size);
panel.showSpec(spec_default);
var fn = null;
panel.reset((cid, v) => fn?.onControl?.(cid, v));
fn = create(model, panel.ui);
var timer = new THREE8.Timer();
view.renderer.setAnimationLoop((ts) => {
  timer.update(ts);
  const dt = Math.min(timer.getDelta(), 0.1);
  view.controls.update();
  fn?.update?.(dt, timer.getElapsed());
  view.scene.updateMatrixWorld();
  overlay.update(view.camera, { showLabels: opts.labels, showDims: opts.dims });
  view.renderer.render(view.scene, view.camera);
});
