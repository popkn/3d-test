<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>로보로보 부품 3D</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&display=swap" />
  <link rel="stylesheet" href="src/viewer/style.css" />
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.186.1/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.186.1/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <aside class="list">
    <header><span class="bar"></span>ROBOROBO PARTS</header>
    <nav id="parts"></nav>
  </aside>

  <main class="stage" id="stage">
    <div class="toggles">
      <button data-k="labels" class="on">LABELS</button>
      <button data-k="dims" class="on">DIMENSIONS</button>
      <button data-k="spin">TURNTABLE</button>
    </div>
    <div class="loading" id="loading">불러오는 중…</div>
    <div class="hint">드래그: 회전 · 휠: 확대 · 1 = 1 mm</div>
  </main>

  <aside class="panel" id="panel">
    <h1 class="p-name"></h1>
    <div class="p-size"></div>
    <p class="p-note"></p>
    <section>
      <h2><span class="bar"></span>기능</h2>
      <p class="p-func"></p>
      <div class="p-controls"></div>
      <dl class="p-readouts"></dl>
      <div class="p-log"></div>
    </section>
    <section>
      <h2><span class="bar"></span>규격</h2>
      <dl class="p-specs"></dl>
    </section>
    <section>
      <h2><span class="bar"></span>연결</h2>
      <ul class="p-ports"></ul>
    </section>
    <a class="p-link" target="_blank" rel="noopener">상품 페이지 ↗</a>
  </aside>

  <script type="module" src="src/main.js"></script>
</body>
</html>
